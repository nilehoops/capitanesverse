name: Fetch Player Photos (roster-based)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: ncaa (our players, writes to players_index.json) or nba (all 30 teams, writes to nba_players.json)'
        required: true
        default: 'ncaa'
        type: choice
        options:
          - ncaa
          - nba

jobs:
  fetch-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch photos via team rosters
        env:
          FETCH_MODE: ${{ github.event.inputs.mode }}
        run: python scripts/fetch_photos_v2.py

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update player photos (roster-based fetch, ${{ github.event.inputs.mode }} mode)"
          file_pattern: data/players_index.json data/nba_players.json
