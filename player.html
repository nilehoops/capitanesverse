<body>

<div id="app"></div>

<script>
// ---- Repo this page saves availability edits to ----
const REPO_OWNER = 'nilehoops';
const REPO_NAME = 'capitanesverse';
const DATA_PATH_IN_REPO = 'data/players.json';

// UTF-8-safe base64 helpers (plain btoa/atob mishandle non-ASCII names)
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

let githubToken = null; // held in memory only for this page load — never stored

// Generic: fetch the live file, let `mutate(target)` change one player's fields,
// then commit. Used by both the Availability editor and the custom-video setter.
async function commitPlayerUpdate(playerId, mutate, commitMessage) {
  if (!githubToken) {
    githubToken = prompt(
      'GitHub personal access token (Contents: read/write on this repo).\n' +
      'Only used for this save, kept in memory only, never stored.'
    );
    if (!githubToken) return { ok: false, message: 'Cancelled — no token entered.' };
  }

  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH_IN_REPO}`;
  const headers = {
    'Authorization': `Bearer ${githubToken}`,
    'Accept': 'application/vnd.github+json',
  };

  try {
    const getResp = await fetch(apiUrl, { headers });
    if (!getResp.ok) return { ok: false, message: `Could not read file (${getResp.status}). Check token permissions.` };
    const fileData = await getResp.json();
    const content = base64ToUtf8(fileData.content);
    const allPlayers = JSON.parse(content);

    const target = allPlayers.find(p => p.id === playerId);
    if (!target) return { ok: false, message: 'Player not found in remote file.' };
    mutate(target);

    const updatedContent = JSON.stringify(allPlayers, null, 2);
    const putResp = await fetch(apiUrl, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: commitMessage(target),
        content: utf8ToBase64(updatedContent),
        sha: fileData.sha,
      }),
    });
    if (!putResp.ok) {
      const err = await putResp.json().catch(() => ({}));
      return { ok: false, message: `Save failed (${putResp.status}): ${err.message || 'unknown error'}` };
    }
    return { ok: true, message: 'Saved — live site updates in ~1 min.' };
  } catch (e) {
    return { ok: false, message: `Network error: ${e.message}` };
  }
}

function saveAvailabilityToGitHub(playerId, newSimple, newNote) {
  return commitPlayerUpdate(
    playerId,
    (target) => { target.availabilitySimple = newSimple; target.availabilityNote = newNote || null; },
    (target) => `Update availability: ${target.name} -> ${newSimple}${newNote ? ' (' + newNote + ')' : ''}`
  );
}

// Accepts a full YouTube URL (watch?v=, youtu.be/, embed/) or a bare 11-char video ID.
function extractYouTubeId(input) {
  const s = input.trim();
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/,
  ];
  for (const p of patterns) {
    const m = s.match(p);
    if (m) return m[1];
  }
  if (/^[\w-]{11}$/.test(s)) return s;
  return null;
}

function saveCustomVideo(playerId, slotIndex, videoId) {
  return commitPlayerUpdate(
    playerId,
    (target) => {
      target.videos = target.videos || [null, null];
      while (target.videos.length <= slotIndex) target.videos.push(null);
      target.videos[slotIndex] = {
        id: videoId,
        title: 'Custom pick',
        thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
      };
    },
    (target) => `Set custom video ${slotIndex + 1} for ${target.name}`
  );
}

// Precise age to 2 decimals when we have a clean, unqualified birthdate;
// falls back to the stored whole-year age for fuzzy/uncertain birthdates.
function computeDecimalAge(bio) {
  if (!bio) return null;
  if (bio.born && /^[A-Z][a-z]{2} \d{1,2}, \d{4}$/.test(bio.born.trim())) {
    const d = new Date(bio.born);
    if (!isNaN(d.getTime())) {
      const msPerYear = 365.25 * 24 * 60 * 60 * 1000;
      return ((Date.now() - d.getTime()) / msPerYear).toFixed(2);
    }
  }
  return bio.age != null ? Number(bio.age).toFixed(2) : null;
}

const STAT_LABELS = {
  gp:"GP", minPct:"Min%", prpg:"PRPG!", dPrpg:"D-PRPG", bpm:"BPM", obpm:"OBPM", dbpm:"DBPM",
  ortg:"ORtg", drtg:"D-Rtg", usg:"Usg", efg:"eFG", ts:"TS", orb:"OR", drb:"DR", ast:"Ast",
  tov:"TO", astToRatio:"A/TO", blk:"Blk", stl:"Stl", ftr:"FTR", fc40:"FC/40",
  dunks:"Dunks", dunkAttempts:"Dunk Att", dunkPct:"Dunk%", rimMakes:"Rim M", rimAttempts:"Rim A",
  rimPct:"Rim%", nonRim2Makes:"NonRim2 M", nonRim2Attempts:"NonRim2 A", nonRim2Pct:"NonRim2%",
  ftMakes:"FT", ftAttempts:"FTA", ftPct:"FT%", twoPM:"2PM", twoPA:"2PA", twoPct:"2P%",
  threePRate:"3PR", threePer100:"3P/100", threePM:"3P", threePA:"3PA", threePct:"3P%", fga:"FGA",
};

// Which direction is "good" for percentile purposes (used by Strengths/Weaknesses).
const LOWER_IS_BETTER = new Set(['tov', 'drtg', 'fc40']);
// Rate/efficiency stats only — raw volume counts (makes/attempts, dunks, GP) don't
// mean much as standalone "strength/weakness" signals, so they're left out here.
const PERCENTILE_KEYS = [
  'minPct','prpg','dPrpg','bpm','obpm','dbpm','ortg','drtg','usg','efg','ts',
  'orb','drb','ast','tov','astToRatio','blk','stl','ftr','fc40',
  'dunkPct','rimPct','nonRim2Pct','ftPct','twoPct','threePRate','threePct',
];

// Tankathon-style tiers: more dots = more extreme percentile. Only stats
// clearing the lowest tier are shown at all — everything else is "average."
function strengthTier(pct) {
  if (pct >= 0.97) return 4;
  if (pct >= 0.90) return 3;
  if (pct >= 0.80) return 2;
  if (pct >= 0.65) return 1;
  return 0;
}
function weaknessTier(pct) {
  if (pct <= 0.03) return 4;
  if (pct <= 0.10) return 3;
  if (pct <= 0.20) return 2;
  if (pct <= 0.35) return 1;
  return 0;
}

function percentileRank(players, position, key, value) {
  const peers = players.filter(p => p.position === position && p.stats[key] != null);
  if (peers.length < 5 || value == null) return null;
  const better = LOWER_IS_BETTER.has(key)
    ? peers.filter(p => p.stats[key] >= value).length
    : peers.filter(p => p.stats[key] <= value).length;
  return better / peers.length;
}

function computeStrengthsWeaknesses(players, player) {
  const strengths = [];
  const weaknesses = [];
  for (const key of PERCENTILE_KEYS) {
    const pct = percentileRank(players, player.position, key, player.stats[key]);
    if (pct == null) continue;
    const sTier = strengthTier(pct);
    const wTier = weaknessTier(pct);
    if (sTier > 0) strengths.push({ key, label: STAT_LABELS[key] || key, pct, tier: sTier });
    else if (wTier > 0) weaknesses.push({ key, label: STAT_LABELS[key] || key, pct, tier: wTier });
  }
  strengths.sort((a, b) => b.tier - a.tier || b.pct - a.pct);
  weaknesses.sort((a, b) => b.tier - a.tier || a.pct - b.pct);
  return { strengths, weaknesses };
}

// Derived ranks: the source sheet doesn't have explicit "Available Rank" or
// "Latino Rank" columns, so both are computed here from Overall Rank.
function computeDerivedRanks(players, player) {
  const availablePool = players.filter(p => p.availabilitySimple === 'yes' && p.overallRank != null)
    .sort((a, b) => a.overallRank - b.overallRank);
  const availableRank = player.availabilitySimple === 'yes'
    ? availablePool.findIndex(p => p.id === player.id) + 1 : null;

  const latinoPool = players.filter(p => p.latino === true && p.overallRank != null)
    .sort((a, b) => a.overallRank - b.overallRank);
  const latinoRank = player.latino === true
    ? latinoPool.findIndex(p => p.id === player.id) + 1 : null;

  return { availableRank: availableRank || null, latinoRank: latinoRank || null };
}

function videoSlot(video, label, slotIndex) {
  const player = video
    ? `<div class="yt-slot"><iframe src="https://www.youtube.com/embed/${video.id}" title="${video.title}" allowfullscreen></iframe></div>`
    : `<div class="yt-slot">Youtube Embed of<br>"'${label}' highlight"<br>(populated by the fetch-videos Action)</div>`;
  const customRow = `
    <div class="yt-custom-row">
      <input type="text" placeholder="Paste YouTube URL or ID" data-slot="${slotIndex}" class="yt-custom-input">
      <button data-slot="${slotIndex}" class="yt-custom-btn">Set</button>
    </div>
    <div class="yt-custom-status" data-slot="${slotIndex}"></div>`;
  return player + customRow;
}

function render(player, players) {
  const { strengths, weaknesses } = computeStrengthsWeaknesses(players, player);
  const { availableRank, latinoRank } = computeDerivedRanks(players, player);
  const videos = player.videos || [];

  document.getElementById('app').innerHTML = `
    <div class="grid">
      <div class="name">
        <a href="index.html" style="font-size:15px; text-decoration:underline; margin-right:16px;">&larr; Main Menu</a>
        <h1 style="display:inline;">${player.onRoster ? `<span class="roster-tag">${player.name}</span>` : player.name}</h1>
        <a class="x-logo-link" href="https://x.com/search?q=${encodeURIComponent(player.name + ' basketball')}&f=live" target="_blank" rel="noopener" title="Search &quot;${player.name}&quot; on X">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>

      <div class="ranktop">
        <div class="line"><a href="rankings.html?pos=overall">Overall Rank: ${player.overallRank ? '#' + player.overallRank : 'N/A'}</a></div>
        <div class="line"><a href="rankings.html?pos=${player.position ? player.position.toLowerCase() : 'overall'}">Positional Rank: ${player.positionalRank ? '#' + player.positionalRank : 'N/A'}</a></div>
      </div>

      <div class="sidebar">
        <div class="sb-search">
          <input id="searchInput" placeholder="Search:" autocomplete="off">
          <div class="sb-search-results" id="searchResults"></div>
        </div>
        <div class="sb-fields">
          <div><span class="lab">Position: </span><span class="val">${player.position || '—'}</span></div>
          <div><span class="lab">Age: </span><span class="val">${computeDecimalAge(player.biography) ?? '—'}</span></div>
          <div><span class="lab">Height: </span><span class="val">${player.heightDisplay || '—'}</span></div>
          <div><span class="lab">Weight: </span><span class="val">${player.biography?.weight ?? '—'}</span></div>
          <div><span class="lab">Last Team: </span><span class="val">${player.team || '—'}</span></div>
          <div><span class="lab">Agency: </span><span class="val">${player.biography?.agent ?? '—'}</span></div>
          <div class="avail-edit-row">
            <span class="lab">Available: </span>
            <select id="availSelect">
              <option value="yes" ${player.availabilitySimple === 'yes' ? 'selected' : ''}>Yes</option>
              <option value="no" ${player.availabilitySimple === 'no' ? 'selected' : ''}>No</option>
              <option value="unknown" ${player.availabilitySimple === 'unknown' ? 'selected' : ''}>Unknown</option>
            </select>
            <input id="availNote" type="text" placeholder="Note (optional)" value="${player.availabilityNote || ''}">
            <button id="saveAvailBtn">Save</button>
            <span id="availStatus"></span>
          </div>
          <div><span class="lab">Latino: </span><span class="val">${player.latino === true ? 'Yes' : player.latino === false ? 'No' : '—'}</span></div>
        </div>
        ${player.biography?.hometown ? `<div class="sb-fields" style="padding-top:0;"><span class="lab">Hometown: </span><span class="val">${player.biography.hometown}</span></div>` : ''}
        <div class="compare-section" id="compareSection"></div>
        <div class="sb-logo">Capitanes 2026<br>Offseason Site</div>
      </div>

      <div class="video1">${videoSlot(videos[0], player.name, 0)}</div>
      <div class="video2">${videoSlot(videos[1], player.name, 1)}</div>

      <div class="ranksmid">
        <div class="line"><a href="rankings.html?pos=overall&availability=available">Available Rank: ${availableRank ? '#' + availableRank : 'N/A'}</a></div>
        <div class="line"><a href="rankings.html?pos=overall&latino=yes">Latino Rank: ${latinoRank ? '#' + latinoRank : 'N/A'}</a></div>
        <div class="staff-head">Staff Notes/Overview:</div>
        <div class="staff-body">${player.staffNotes || 'No staff notes yet.'}</div>
      </div>

      <div class="stats">
        <div class="stats-head">2026 Stats/Metrics</div>
        <div class="stat-table">
          ${Object.entries(STAT_LABELS).map(([key, label]) => {
            const v = player.stats[key];
            return v == null ? '' : `<div><span class="k">${label}:</span> <span class="v">${v}</span></div>`;
          }).join('')}
        </div>
      </div>

      <div class="strong">
        <div class="box-title">Stat Strengths</div>
        <div class="box-sub">Relative to the position group</div>
        ${strengths.map(s => `<div class="stat-row"><span class="dot-row">${'<span class="dot"></span>'.repeat(s.tier)}</span>${s.label}</div>`).join('') || '<div class="box-sub">No standout strengths yet.</div>'}
      </div>

      <div class="weak">
        <div class="box-title">Stat Weaknesses</div>
        <div class="box-sub">Relative to the position group</div>
        ${weaknesses.map(s => `<div class="stat-row"><span class="dot-row">${'<span class="dot"></span>'.repeat(s.tier)}</span>${s.label}</div>`).join('') || '<div class="box-sub">No notable weaknesses yet.</div>'}
      </div>

      <div class="crowd">
        <div class="box-title">Community Notes</div>
        <div class="box-sub">Real, shared comments via GitHub Discussions — visible to everyone.</div>
        <div id="giscusContainer"></div>
      </div>
    </div>
  `;

  setupSearch(players);
  loadGiscus(player);
  setupAvailabilitySave(player);
  setupCustomVideo(player);
  renderCompareTo(players, player);
}

// ---- Compare To: best-available / best-available-Latino / 2026 Capitanes /
// Current Roster, each filtered to this player's own position, top 3 by rank.
function compareGroupHtml(label, list) {
  const cards = list.map(p => `
    <a class="compare-player" href="player.html?id=${p.id}">
      ${p.photoUrl ? `<img src="${p.photoUrl}" alt="${p.name}">` : `<div class="noimg">?</div>`}
      <div class="cname">${p.name.split(' ').pop()}</div>
    </a>`).join('');
  return `
    <div class="compare-group">
      <div class="compare-group-label">${label}</div>
      ${list.length ? `<div class="compare-players">${cards}</div>` : `<div class="compare-empty">None yet.</div>`}
    </div>`;
}

function renderCompareTo(players, player) {
  const pos = player.position;
  const samePos = players.filter(p => p.position === pos && p.id !== player.id);

  const top3 = (arr, key) => arr.filter(p => p[key] != null).sort((a, b) => a[key] - b[key]).slice(0, 3);

  const bestAvailable = top3(samePos.filter(p => p.availabilitySimple === 'yes'), 'positionalRank');
  const bestAvailableLatino = top3(samePos.filter(p => p.availabilitySimple === 'yes' && p.latino === true), 'positionalRank');
  const capitanes2026 = top3(samePos.filter(p => (p.biography?.currentStatus || '').includes('Mexico City Capitanes')), 'positionalRank');
  const currentRoster = samePos.filter(p => p.onRoster).slice(0, 3);

  document.getElementById('compareSection').innerHTML = `
    <div class="compare-title">Compare To (${pos || '—'})</div>
    ${compareGroupHtml('Best Available', bestAvailable)}
    ${compareGroupHtml('Best Available Latino', bestAvailableLatino)}
    ${compareGroupHtml('2026 Capitanes', capitanes2026)}
    ${compareGroupHtml('Current Roster Capitanes', currentRoster)}
  `;
}

function setupCustomVideo(player) {
  document.querySelectorAll('.yt-custom-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const slot = parseInt(btn.dataset.slot, 10);
      const input = document.querySelector(`.yt-custom-input[data-slot="${slot}"]`);
      const status = document.querySelector(`.yt-custom-status[data-slot="${slot}"]`);
      const videoId = extractYouTubeId(input.value);
      if (!videoId) { status.textContent = "Couldn't read a video ID from that."; return; }
      status.textContent = 'Saving...';
      const result = await saveCustomVideo(player.id, slot, videoId);
      status.textContent = result.message;
    });
  });
}

function setupAvailabilitySave(player) {
  document.getElementById('saveAvailBtn').addEventListener('click', async () => {
    const select = document.getElementById('availSelect');
    const noteInput = document.getElementById('availNote');
    const status = document.getElementById('availStatus');
    const newSimple = select.value;
    const newNote = noteInput.value.trim();
    status.textContent = 'Saving...';
    const result = await saveAvailabilityToGitHub(player.id, newSimple, newNote);
    status.textContent = result.message;
    if (result.ok) {
      player.availabilitySimple = newSimple;
      player.availabilityNote = newNote || null;
    }
  });
}

// ---- Community notes: real, shared comments via giscus (GitHub Discussions) ----
// Requires one-time setup on github.com before this works:
//   1. Repo Settings -> General -> Features -> check "Discussions"
//   2. On the repo's Discussions tab, create a category (e.g. "Player Comments"),
//      format = Announcement, so only giscus's bot can open new threads
//   3. Install the giscus app for this repo: https://github.com/apps/giscus
//   4. Go to https://giscus.app, enter nilehoops/capitanesverse, pick that category
//      -> it generates real values for GISCUS_REPO_ID / GISCUS_CATEGORY_ID below
const GISCUS_REPO_ID = 'R_kgDOTmW7rg';
const GISCUS_CATEGORY = 'Player Comments';        // must match the category name from step 2
const GISCUS_CATEGORY_ID = 'DIC_kwDOTmW7rs4DCXTk';

function loadGiscus(player) {
  const container = document.getElementById('giscusContainer');
  if (!container) return;
  container.innerHTML = '';
  const script = document.createElement('script');
  script.src = 'https://giscus.app/client.js';
  script.setAttribute('data-repo', `${REPO_OWNER}/${REPO_NAME}`);
  script.setAttribute('data-repo-id', GISCUS_REPO_ID);
  script.setAttribute('data-category', GISCUS_CATEGORY);
  script.setAttribute('data-category-id', GISCUS_CATEGORY_ID);
  // "specific" + a per-player term (not the default "pathname") — every player
  // shares the same physical file (player.html?id=X), so pathname mapping would
  // incorrectly dump every player's comments into one shared thread.
  script.setAttribute('data-mapping', 'specific');
  script.setAttribute('data-term', `player-${player.id}`);
  script.setAttribute('data-strict', '1'); // avoid fuzzy-matching similar player names to the wrong thread
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-input-position', 'top');
  script.setAttribute('data-theme', 'dark_dimmed');
  script.setAttribute('data-lang', 'en');
  script.crossOrigin = 'anonymous';
  script.async = true;
  container.appendChild(script);
}

function setupSearch(players) {
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.innerHTML = ''; return; }
    const matches = players.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
    results.innerHTML = matches.map(p => `<a href="player.html?id=${p.id}">${p.onRoster ? `<span class="roster-tag">${p.name}</span>` : p.name}</a>`).join('');
  });
}

const playerId = new URLSearchParams(location.search).get('id');
fetch('data/players.json?v=' + Date.now())
  .then(r => r.json())
  .then(players => {
    const player = players.find(p => p.id === playerId);
    if (!player) {
      document.getElementById('app').innerHTML = `<div class="notfound">Player not found: ${playerId || '(no id given)'}</div>`;
      return;
    }
    render(player, players);
  })
  .catch(err => {
    console.error('Could not load data/players.json', err);
    document.getElementById('app').innerHTML = '<div class="notfound">Could not load data/players.json.</div>';
  });
</script>
