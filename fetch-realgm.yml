name: Fetch RealGM Player Data

on:
  schedule:
    - cron: '0 7 * * 3'   # weekly, Wednesday 7am UTC
  workflow_dispatch: {}    # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  fetch-realgm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas

      - name: Fetch RealGM data for each player
        run: python scripts/fetch_realgm.py

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update player age/weight/agent/team/current stats from RealGM'
          file_pattern: data/players.json
