name: Update Capitanes Play-by-Play Data

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pbp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nba_api pandas requests

      - name: Update 2026-27 Lineups & Shot Charts
        run: |
          python pipeline/build_exact_lineups.py 2026-27
          python pipeline/build_shot_charts.py 2026-27

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update 2026-27 Capitanes PBP lineups & shot charts"
          git push
