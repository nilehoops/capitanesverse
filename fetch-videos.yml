name: Fetch Player Videos

on:
  workflow_dispatch: {}    # adds a manual "Run workflow" button — no automatic schedule

permissions:
  contents: write

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp

      - name: Pull latest before running (in case anything changed since checkout)
        run: git pull origin main

      - name: Fetch videos for each player
        run: python scripts/fetch_videos.py

      - name: Pull latest changes before committing
        run: git pull --rebase origin main

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update player video links'
          file_pattern: data/players.json
