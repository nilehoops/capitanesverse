<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Capitanes Talent Pool Ranking Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #ECECEC; font-family: 'Lora', serif; font-weight: 700; }
  a, button { color: inherit; cursor: pointer; }
  input { font-family: 'Lora', serif; }

  /* ---- Login ---- */
  .login-wrap { max-width: 360px; margin: 80px auto; text-align: center; padding: 0 20px; }
  .login-wrap h1 { font-size: 28px; margin-bottom: 24px; }
  .login-wrap input {
    width: 100%; background: #000; color: #ECECEC; border: 1px solid #444;
    font-size: 16px; padding: 8px; margin-bottom: 10px;
  }
  .login-wrap button {
    width: 100%; background: #ECECEC; color: #000; border: none;
    font-family: 'Lora', serif; font-weight: 700; font-size: 15px; padding: 10px; margin-top: 6px;
  }
  .login-error { color: #D81F2A; font-size: 13px; margin-top: 8px; font-weight: 400; }
  .adduser-toggle-row { margin-top: 20px; }
  .adduser-link { font-size: 13px; text-decoration: underline; cursor: pointer; color: #9A9A9A; }
  .adduser-form { display: none; margin-top: 12px; border-top: 1px solid #333; padding-top: 12px; }
  .adduser-form.open { display: block; }

  /* ---- Menu screen ---- */
  .menu-wrap { text-align: center; padding: 40px 20px; }
  .menu-title { font-size: clamp(28px, 5vw, 46px); margin-bottom: 6px; }
  .menu-sub { font-size: 20px; margin-bottom: 30px; }
  .pos-row { display: flex; justify-content: center; gap: 50px; flex-wrap: wrap; }
  .pos-btn { background: none; border: none; text-align: center; }
  .pos-btn .pos-name { font-size: clamp(48px, 9vw, 110px); line-height: 1; display: block; }
  .pos-btn .pos-progress { font-size: 13px; font-weight: 400; color: #9A9A9A; display: block; margin-top: 6px; }
  .complete-rankings-section { text-align: center; margin: 36px 0 0; }
  .complete-rankings-btn {
    font-family: 'Lora', serif; font-weight: 700; font-size: 22px; padding: 14px 34px;
    background: #FFD400; color: #000; border: none; cursor: pointer;
  }
  .complete-rankings-section.locked .complete-rankings-btn {
    background: #2A2A2A; color: #6A6A6A; cursor: not-allowed;
  }
  .complete-rankings-note { font-size: 13px; font-weight: 400; color: #9A9A9A; margin-top: 8px; }

  .pane-search {
    width: 100%; background: #000; color: #ECECEC; border: 1px solid #444;
    font-family: 'Lora', serif; font-size: 13px; padding: 6px 8px;
  }
  .incomplete-list { overflow-y: auto; }
  .pane-empty { padding: 14px; font-size: 12px; color: #6A6A6A; }
  .final-card {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid #1A1A1A; font-size: 13px; font-weight: 400;
  }
  .final-card .rank-num { font-family: 'Lora', serif; font-weight: 700; color: #FFD400; min-width: 30px; }
  .final-card .cname { flex: 1; }
  .final-card .nudge {
    background: none; border: 1px solid #444; color: #ECECEC; font-size: 11px;
    width: 22px; height: 22px; cursor: pointer; padding: 0;
  }
  .final-card .jumpinput {
    width: 44px; background: #000; color: #ECECEC; border: 1px solid #444;
    font-family: 'Lora', serif; font-size: 11px; padding: 3px;
  }

  .menu-footer {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 900px; margin: 50px auto 0; padding: 0 10px; font-size: 15px; flex-wrap: wrap; gap: 10px;
  }
  .menu-footer button { background: none; border: none; font-family: 'Lora', serif; font-weight: 700; font-size: 15px; text-decoration: underline; }
  .menu-status { font-size: 12px; font-weight: 400; color: #9A9A9A; margin-top: 10px; }

  html, body { height: 100%; margin: 0; overflow: hidden; }

  /* ---- Ranking screen ---- */
  .rank-grid { display: grid; grid-template-columns: 190px 1fr 380px; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; }
  .rank-util { background: #000; padding: 14px; border-right: 1px solid #222; font-size: 15px; line-height: 1.7; overflow-y: auto; min-height: 0; }
  .rank-util a, .rank-util button { display: block; background: none; border: none; font-family: 'Lora', serif; font-weight: 700; font-size: 15px; padding: 0; text-align: left; }
  .rank-util .link-menu, .rank-util .link-save { color: #4FD1FF; text-decoration: underline; margin-bottom: 4px; }
  .rank-util .tally { font-size: 14px; margin-top: 10px; }
  .rank-util .link-skip { color: #3FCF5C; text-decoration: underline; margin-top: 12px; }

  .rank-middle { grid-column: 2; grid-row: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #222; }

  .rank-prostints { background: #000; padding: 18px; flex: 1 1 auto; }
  .rank-prostints .box-title { font-size: 20px; margin-bottom: 12px; }
  .prostint-card { border: 1px solid #262626; padding: 14px 16px; margin-bottom: 14px; }
  .prostint-league { font-size: 20px; font-weight: 700; }
  .prostint-league .strength { font-size: 13px; font-weight: 400; color: #8A8A8A; display: block; margin-top: 4px; }
  .prostint-league .strength a { color: #4FD1FF; text-decoration: underline; }
  .prostint-stats { font-size: 15px; font-weight: 400; color: #ECECEC; margin-top: 10px; line-height: 2; }
  .prostint-stats .k { color: #9A9A9A; }
  .no-prostints { font-size: 13px; color: #6A6A6A; padding: 8px 0; }
  .pctile-sub { color: #8A8A8A; margin-left: 4px; }

  .rank-stats { background: #000; padding: 14px 18px; border-top: 1px solid #222; }
  .rank-stats h2 { font-size: 26px; margin: 0 0 6px; }
  .rank-physicals { font-size: 16px; font-weight: 400; margin-bottom: 12px; }
  .rank-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px 14px; font-size: 13px; font-weight: 400; }
  .rank-stat-grid .k { color: #9A9A9A; }
  .rank-stat-grid .v { color: #ECECEC; font-weight: 600; }

  .rank-right { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
  .sw-row { display: grid; grid-template-columns: 1fr 1fr; flex: 1; }
  .sw-box { padding: 14px; }
  .sw-box.strengths { background: #128A3E; }
  .sw-box.weaknesses { background: #D81F2A; }
  .sw-box .sw-title { font-size: 20px; margin-bottom: 8px; }
  .sw-box .sw-item { font-size: 14px; margin: 3px 0; display: flex; align-items: center; gap: 6px; }
  .pbar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  .pbar-label { width: 76px; flex-shrink: 0; font-weight: 700; }
  .pbar-track { flex: 1; height: 12px; background: rgba(0,0,0,0.3); position: relative; }
  .pbar-fill { display: block; height: 100%; background: #ECECEC; }
  .pbar-value { width: 60px; flex-shrink: 0; text-align: right; font-weight: 400; }
  .pbar-value sub { margin-left: 3px; opacity: 0.75; }

  .shotdiet-wrap { margin: 10px 0 14px; }
  .shotdiet-bar { display: flex; height: 22px; overflow: hidden; border: 1px solid #262626; }
  .shotdiet-seg.rim { background: #D8641F; }
  .shotdiet-seg.mid { background: #6A6A6A; }
  .shotdiet-seg.three { background: #1B6FD1; }
  .shotdiet-legend { display: flex; gap: 16px; margin-top: 6px; font-size: 12px; font-weight: 400; flex-wrap: wrap; }
  .shotdiet-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .shotdiet-legend .dot.rim { background: #D8641F; }
  .shotdiet-legend .dot.mid { background: #6A6A6A; }
  .shotdiet-legend .dot.three { background: #1B6FD1; }
  .shotdiet-legend sub { margin-left: 3px; opacity: 0.7; }
  .sw-box .sw-empty { font-size: 12px; font-weight: 400; }

  .tier-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .tier-btn { border: none; padding: 26px 10px; font-family: 'Lora', serif; font-weight: 700; font-size: 22px; text-align: center; }
  .tier-allstar { background: #128A3E; color: #ECECEC; }
  .tier-rotation { background: #6A1B9A; color: #ECECEC; }
  .tier-starter { background: #1B4FBF; color: #ECECEC; }
  .tier-sub { background: #D81F2A; color: #ECECEC; }
  .tier-btn:hover { filter: brightness(1.15); }

  .rank-nav {
    grid-column: 1 / -1; grid-row: 2; display: flex; flex-direction: column; align-items: center;
    gap: 10px; background: #000; border-top: 1px solid #222; padding: 14px; font-size: 18px;
  }
  .rank-nav-main { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .rank-nav button { background: none; border: none; font-family: 'Lora', serif; font-weight: 700; font-size: 18px; color: #6A1B9A; }
  .rank-nav .rank-nav-skip { color: #3FCF5C; text-decoration: underline; }
  .rank-nav .rank-nav-progress { color: #ECECEC; }
  .rank-nav-extra { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 13px; font-weight: 400; }
  .rank-nav-extra a { color: #4FD1FF; text-decoration: underline; cursor: pointer; }

  .done-msg { grid-column: 1 / -1; text-align: center; padding: 60px 20px; font-size: 20px; }

  /* ---- Within-tier refinement panel ---- */
  .tier-refine-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50;
    align-items: center; justify-content: center;
  }
  .tier-refine-overlay.open { display: flex; }
  .tier-refine-box {
    background: #0D0D0D; border: 1px solid #333; width: min(720px, 92vw); max-height: 84vh;
    overflow-y: auto; padding: 20px;
  }
  .tier-refine-box h3 { font-size: 20px; margin: 0 0 4px; }
  .tier-refine-box .sub { font-size: 12px; font-weight: 400; color: #9A9A9A; margin-bottom: 14px; }
  .tier-refine-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tier-refine-tab {
    font-family: 'Lora', serif; font-weight: 700; font-size: 13px; padding: 5px 10px;
    background: none; border: 1px solid #444; color: #ECECEC; cursor: pointer;
  }
  .tier-refine-tab.active { background: #ECECEC; color: #000; }
  .tier-refine-list { min-height: 40px; }
  .tier-refine-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #262626;
    margin-bottom: 6px; cursor: grab; font-size: 14px;
  }
  .tier-refine-row.dragging { opacity: 0.35; }
  .tier-refine-row.drag-over { border-top: 2px solid #FFD400; }
  .tier-refine-row .refine-rank { color: #FFD400; font-weight: 700; min-width: 22px; }
  .tier-refine-empty { font-size: 12px; color: #6A6A6A; padding: 8px 0; }
  .tier-refine-close {
    margin-top: 14px; font-family: 'Lora', serif; font-weight: 700; font-size: 13px;
    background: #ECECEC; color: #000; border: none; padding: 6px 14px; cursor: pointer;
  }

  @media (max-width: 860px) {
    .rank-grid { grid-template-columns: 1fr; }
    .rank-stats { grid-column: 1; }
    .sw-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const REPO_OWNER = 'nilehoops';
const REPO_NAME = 'capitanesverse';
const PLAYERS_INDEX_PATH = 'data/players_index.json';
const PLAYERS_DETAIL_PATH = 'data/players_detail.json';
const USERS_PATH = 'data/blindrank_users.json';
const userDataPath = (username) => `data/blind_rankings/${username}.json`;

// Visual order matches the wireframe's 2x2 grid exactly (top-left, top-right, bottom-left, bottom-right).
// Values (0-3) match the tier numbers already used elsewhere in this dataset.
const TIER_INFO = [
  { value: 0, label: 'G League All Star+', cls: 'tier-allstar' },
  { value: 2, label: 'G League Rotation',  cls: 'tier-rotation' },
  { value: 1, label: 'G League Starter',   cls: 'tier-starter' },
  { value: 3, label: 'Sub G League',       cls: 'tier-sub' },
];
const TIER_LABEL_BY_VALUE = Object.fromEntries(TIER_INFO.map(t => [t.value, t.label]));

const STAT_LABELS = {
  gp:"GP", minPct:"Min%", prpg:"PRPG!", bpm:"BPM", obpm:"OBPM", dbpm:"DBPM",
  ortg:"ORtg", drtg:"D-Rtg", usg:"Usg", efg:"eFG", ts:"TS", orb:"OR", drb:"DR", ast:"Ast",
  tov:"TO", blk:"Blk", stl:"Stl", ftr:"FTR", ftPct:"FT%", twoPct:"2P%", threePct:"3P%",
};
// Full stat set used by Strengths/Weaknesses. min%/dunk%/fc40 removed per
// request; dunksPerGame and bmi added as computed (non-`stats`-object) getters.
// scale100: true means the raw value is already 0-100 (append % as-is);
// scale100 absent/false + pct:true means it's a 0-1 fraction (×100 first).
const SW_STATS = [
  { key: 'prpg', label: 'PRPG!' }, { key: 'dPrpg', label: 'D-PRPG' },
  { key: 'bpm', label: 'BPM' }, { key: 'obpm', label: 'OBPM' }, { key: 'dbpm', label: 'DBPM' },
  { key: 'ortg', label: 'ORtg' }, { key: 'drtg', label: 'D-Rtg' },
  { key: 'usg', label: 'Usg', pct: true, scale100: true },
  { key: 'efg', label: 'eFG', pct: true, scale100: true },
  { key: 'ts', label: 'TS', pct: true, scale100: true },
  { key: 'orb', label: 'OR', pct: true, scale100: true },
  { key: 'drb', label: 'DR', pct: true, scale100: true },
  { key: 'ast', label: 'Ast', pct: true, scale100: true },
  { key: 'tov', label: 'TO', pct: true, scale100: true },
  { key: 'astToRatio', label: 'A/TO', suffix: 'x' },
  { key: 'blk', label: 'Blk', pct: true, scale100: true },
  { key: 'stl', label: 'Stl', pct: true, scale100: true },
  { key: 'ftr', label: 'FTR', pct: true, scale100: true },
  { key: 'rimPct', label: 'Rim%', pct: true },
  { key: 'nonRim2Pct', label: 'NonRim2%', pct: true },
  { key: 'ftPct', label: 'FT%', pct: true },
  { key: 'twoPct', label: '2P%', pct: true },
  { key: 'threePRate', label: '3PR', pct: true, scale100: true },
  { key: 'threePct', label: '3P%', pct: true },
  { key: 'dunksPerGame', label: 'Dunks/G' },
  { key: 'bmi', label: 'BMI' },
];
const LOWER_IS_BETTER = new Set(['tov', 'drtg']);

// dunksPerGame and bmi aren't plain `stats` fields — computed here instead.
function getSwValue(player, key) {
  if (key === 'dunksPerGame') {
    const d = player.stats?.dunks, gp = player.stats?.gp;
    return (d != null && gp) ? d / gp : null;
  }
  if (key === 'bmi') {
    const w = player.biography?.weight, h = player.heightIn;
    if (!w || !h) return null;
    const lbs = parseFloat(String(w).match(/^\d+/)?.[0]);
    return lbs ? 703 * lbs / (h * h) : null;
  }
  return player.stats?.[key];
}
function formatSwValue(descriptor, value) {
  if (value == null) return '';
  let v = value;
  if (descriptor.pct && !descriptor.scale100) v = v * 100;
  let s = v.toFixed(1);
  if (descriptor.pct) s += '%';
  if (descriptor.suffix) s += descriptor.suffix;
  return s;
}

function percentileRank(players, position, key, value) {
  const peers = players.map(p => ({ p, v: getSwValue(p, key) })).filter(x => x.p.position === position && x.v != null);
  if (peers.length < 5 || value == null) return null;
  const better = LOWER_IS_BETTER.has(key)
    ? peers.filter(x => x.v >= value).length
    : peers.filter(x => x.v <= value).length;
  return better / peers.length;
}

// Shot diet: where a player's shots come from (rim / mid-range / three),
// each shown with its percentile rank vs. same-position peers, subscripted.
// rimRate is stored 0-1; threePRate is already 0-100 — normalize both to 0-100.
function rimRatePct(p) { return p.advanced?.rimRate != null ? p.advanced.rimRate * 100 : null; }
function midRangeRate(p) {
  const rim = rimRatePct(p), three = p.stats?.threePRate;
  return (rim != null && three != null) ? Math.max(0, 100 - rim - three) : null;
}
function pctRankGeneric(players, position, value, getter) {
  const peers = players.map(p => ({ p, v: getter(p) })).filter(x => x.p.position === position && x.v != null);
  if (peers.length < 5 || value == null) return null;
  return peers.filter(x => x.v <= value).length / peers.length;
}
// Percentile for a stint stat, computed across the flattened pool of ALL
// stints from same-position players (not narrowed to the same league — with
// most leagues having only a handful of tracked players, a same-league-only
// sample would be too small to mean anything; this is a broader "how does
// this compare to other tracked players' pro-level production" signal).
const STINT_LOWER_IS_BETTER = new Set(['tov40']);
function stintPercentile(players, position, key, value) {
  if (value == null) return null;
  const pool = [];
  for (const p of players) {
    if (p.position !== position) continue;
    for (const s of (p.proStints || [])) {
      if (s[key] != null) pool.push(s[key]);
    }
  }
  if (pool.length < 5) return null;
  const better = STINT_LOWER_IS_BETTER.has(key)
    ? pool.filter(v => v >= value).length
    : pool.filter(v => v <= value).length;
  return Math.round((better / pool.length) * 100);
}
function proStintsHtml(players, player) {
  const stints = player.proStints || [];
  if (!stints.length) return '<div class="no-prostints">No pro/other-league stints on file.</div>';
  return stints.map(s => {
    const leaguePctile = s.leagueStrengthPctile != null ? Math.round(s.leagueStrengthPctile * 100) : null;
    const fmt = (key, isPct) => {
      const v = s[key];
      if (v == null) return '—';
      const display = isPct ? (v * 100).toFixed(1) + '%' : v;
      const pct = stintPercentile(players, player.position, key, v);
      return `${display}${pct != null ? `<sub class="pctile-sub">${pct}</sub>` : ''}`;
    };
    return `
      <div class="prostint-card">
        <div class="prostint-league">
          ${s.league}${s.season ? ` (${s.season})` : ''}
          <span class="strength">${leaguePctile != null
            ? `${leaguePctile}th %ile League <a href="https://www.noceilingsnba.com/p/ranking-the-top-basketball-leagues" target="_blank" rel="noopener">Simple Rating System</a>`
            : `League strength n/a`}</span>
        </div>
        <div class="prostint-stats">
          <span class="k">PTS/40:</span> ${fmt('pts40')}
          &nbsp; <span class="k">ORB/40:</span> ${fmt('orb40')}
          &nbsp; <span class="k">DRB/40:</span> ${fmt('drb40')}
          &nbsp; <span class="k">AST/40:</span> ${fmt('ast40')}<br>
          <span class="k">TOV/40:</span> ${fmt('tov40')}
          &nbsp; <span class="k">STL/40:</span> ${fmt('stl40')}
          &nbsp; <span class="k">BLK/40:</span> ${fmt('blk40')}
          &nbsp; <span class="k">PER:</span> ${s.per ?? '—'}<br>
          <span class="k">2P%:</span> ${fmt('2p_pct', true)}
          &nbsp; <span class="k">3P%:</span> ${fmt('3p_pct', true)}
          &nbsp; <span class="k">FT%:</span> ${fmt('ft_pct', true)}
        </div>
      </div>`;
  }).join('');
}

function shotDietHtml(players, player) {
  const rim = rimRatePct(player), mid = midRangeRate(player), three = player.stats?.threePRate;
  if (rim == null || mid == null || three == null) return '';
  const rimPct = pctRankGeneric(players, player.position, rim, rimRatePct);
  const midPct = pctRankGeneric(players, player.position, mid, midRangeRate);
  const threePct = pctRankGeneric(players, player.position, three, p => p.stats?.threePRate);
  const r = (v) => v != null ? Math.round(v * 100) : null;
  return `
    <div class="shotdiet-wrap">
      <div class="shotdiet-bar">
        <span class="shotdiet-seg rim" style="width:${rim}%;" title="Rim Rate: ${rim.toFixed(1)}%"></span>
        <span class="shotdiet-seg mid" style="width:${mid}%;" title="NonRim2 Rate: ${mid.toFixed(1)}%"></span>
        <span class="shotdiet-seg three" style="width:${three}%;" title="3PAr: ${three.toFixed(1)}%"></span>
      </div>
      <div class="shotdiet-legend">
        <span><span class="dot rim"></span>Rim Rate ${rim.toFixed(1)}%${r(rimPct)!=null?`<sub>${r(rimPct)}</sub>`:''}</span>
        <span><span class="dot mid"></span>NonRim2 Rate ${mid.toFixed(1)}%${r(midPct)!=null?`<sub>${r(midPct)}</sub>`:''}</span>
        <span><span class="dot three"></span>3PAr ${three.toFixed(1)}%${r(threePct)!=null?`<sub>${r(threePct)}</sub>`:''}</span>
      </div>
    </div>`;
}

// For players with no usable NCAA stats at all (non-D1 players like Agapy
// Santos, tracked only via pro-league per-40 stints) — S/W falls back to
// comparing their per-40 pro numbers against other players' per-40 pro
// numbers, using the same stintPercentile pool as the Pro Stints cards.
const STINT_SW_STATS = [
  { key: 'pts40', label: 'PTS/40' }, { key: 'orb40', label: 'ORB/40' }, { key: 'drb40', label: 'DRB/40' },
  { key: 'ast40', label: 'AST/40' }, { key: 'tov40', label: 'TOV/40' },
  { key: 'stl40', label: 'STL/40' }, { key: 'blk40', label: 'BLK/40' },
  { key: '2p_pct', label: '2P%', pct: true }, { key: '3p_pct', label: '3P%', pct: true }, { key: 'ft_pct', label: 'FT%', pct: true },
];
function computeStrengthsWeaknessesFromStint(players, player) {
  const stints = player.proStints || [];
  if (!stints.length) return { strengths: [], weaknesses: [], source: null };
  const primary = stints.reduce((best, s) => (s.mins || 0) > (best.mins || 0) ? s : best, stints[0]);
  const strengths = [], weaknesses = [];
  for (const d of STINT_SW_STATS) {
    const value = primary[d.key];
    if (value == null) continue;
    const pct = stintPercentile(players, player.position, d.key, value);
    if (pct == null) continue;
    const valueDisplay = d.pct ? (value * 100).toFixed(1) + '%' : value.toFixed(1);
    const row = { label: d.label, pct, valueDisplay };
    if (pct >= 50) strengths.push(row); else weaknesses.push(row);
  }
  strengths.sort((a, b) => b.pct - a.pct);
  weaknesses.sort((a, b) => a.pct - b.pct);
  const source = primary.league + (primary.season ? ` (${primary.season})` : '');
  return { strengths, weaknesses, source };
}

function topStrengthsWeaknesses(players, player) {
  const hasUsableStats = player.stats && Object.values(player.stats).some(v => v != null);
  if (!hasUsableStats) return computeStrengthsWeaknessesFromStint(players, player);
  const strengths = [], weaknesses = [];
  for (const d of SW_STATS) {
    const value = getSwValue(player, d.key);
    const pct = percentileRank(players, player.position, d.key, value);
    if (pct == null) continue;
    const row = { label: d.label, pct: Math.round(pct * 100), valueDisplay: formatSwValue(d, value) };
    if (row.pct >= 50) strengths.push(row); else weaknesses.push(row);
  }
  strengths.sort((a, b) => b.pct - a.pct);
  weaknesses.sort((a, b) => a.pct - b.pct);
  return { strengths, weaknesses, source: null };
}
function pbarRow(row) {
  return `
    <div class="pbar-row">
      <span class="pbar-label">${row.label}</span>
      <span class="pbar-track"><span class="pbar-fill" style="width:${row.pct}%;"></span></span>
      <span class="pbar-value">${row.valueDisplay}<sub>${row.pct}</sub></span>
    </div>`;
}


function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function computeDecimalAge(bio) {
  if (!bio) return null;
  if (bio.born && /^[A-Z][a-z]{2} \d{1,2}, \d{4}$/.test(bio.born.trim())) {
    const d = new Date(bio.born);
    if (!isNaN(d.getTime())) return ((Date.now() - d.getTime()) / (365.25 * 24 * 60 * 60 * 1000)).toFixed(1);
  }
  return bio.age != null ? Number(bio.age).toFixed(1) : null;
}

// ---- GitHub commit helpers (same pattern as the rest of the site) ----
let githubToken = null;
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = ''; bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function ensureToken() {
  if (!githubToken) {
    githubToken = prompt('GitHub personal access token (Contents: read/write on this repo).\nUsed only this session, never stored.');
  }
  return githubToken;
}
async function ghGetJson(path) {
  const token = ensureToken();
  if (!token) return { ok: false, notFound: false, data: null, sha: null };
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
  if (resp.status === 404) return { ok: true, notFound: true, data: null, sha: null };
  if (!resp.ok) return { ok: false, notFound: false, data: null, sha: null };
  const fileData = await resp.json();
  return { ok: true, notFound: false, data: JSON.parse(base64ToUtf8(fileData.content)), sha: fileData.sha };
}
async function ghPutJson(path, obj, sha, message) {
  const token = ensureToken();
  if (!token) return { ok: false, message: 'No token entered.' };
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const body = { message, content: utf8ToBase64(JSON.stringify(obj, null, 2)) };
  if (sha) body.sha = sha;
  const resp = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    return { ok: false, message: `Save failed (${resp.status}): ${err.message || 'unknown error'}` };
  }
  return { ok: true, message: 'Saved.' };
}

// Public, unauthenticated read — no token needed since this repo is public.
// This is the ONLY GitHub call the ranking flow makes for regular contributors;
// they never see a token prompt. Writing (see ghPutJson above) is owner-only,
// used solely by the "+ Add User" admin action.
async function fetchPublicJson(path) {
  const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${path}?v=${Date.now()}`;
  const resp = await fetch(url);
  if (resp.status === 404) return { ok: true, notFound: true, data: null };
  if (!resp.ok) return { ok: false, notFound: false, data: null };
  return { ok: true, notFound: false, data: await resp.json() };
}
function downloadJson(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// A browser can't attach a file or actually send an email on its own — that's
// a hard security restriction, not something codeable around. This downloads
// the file, then opens a pre-filled draft in the user's own mail app; they
// still have to attach the just-downloaded file and hit send themselves.

// ---- Complete Rankings: combine all three tiered position groups into one
// true overall 1-N order. Default-sorted by tier (0=best...3=worst), then by
// each position's within-tier refinement if set — a starting point, not a
// final answer, since only a human can judge across positions.
let overallSearchTerm = '';
function buildDefaultOverallOrder() {
  const rows = [];
  ['guard', 'wing', 'big'].forEach(pk => {
    const pos = userData[pk];
    const tierOrderForPos = pos.tierOrder || {};
    [0, 1, 2, 3].forEach(tierVal => {
      const inTier = pos.order.filter(id => pos.tiers[id] === tierVal);
      const ordered = (tierOrderForPos[tierVal] || []).filter(id => inTier.includes(id));
      inTier.forEach(id => { if (!ordered.includes(id)) ordered.push(id); });
      ordered.forEach(id => rows.push({ id, tier: tierVal, posKey: pk }));
    });
  });
  rows.sort((a, b) => a.tier - b.tier);
  return rows.map(r => r.id);
}
function openCompleteRankings() {
  userData.overallOrder = userData.overallOrder && userData.overallOrder.length
    ? userData.overallOrder
    : buildDefaultOverallOrder();
  renderCompleteRankings();
}
function getTierFor(p) {
  const pk = p.position === 'Guard' ? 'guard' : p.position === 'Wing' ? 'wing' : 'big';
  return userData[pk].tiers[p.id];
}
function renderCompleteRankings() {
  const term = overallSearchTerm.toLowerCase();
  const fullList = userData.overallOrder.map(id => allPlayers.find(p => p.id === id)).filter(Boolean);
  // Sub G League doesn't need fine-grained ordering — excluded from the
  // interactive list entirely, shown as a simple count instead.
  const rankable = fullList.filter(p => getTierFor(p) !== 3);
  const subG = fullList.filter(p => getTierFor(p) === 3);

  document.getElementById('app').innerHTML = `

      <div class="menu-sub" style="font-size:15px;text-align:left;margin-bottom:16px;">
        Starting order is by tier (All Star+ &rarr; Starter &rarr; Rotation), then your within-tier order. Sub G League players aren't included here — no need to fine-rank them.
        Type a number and hit Enter, or use the arrows, to place a player precisely — this is the step where you actually compare across positions.
      </div>
      <input class="pane-search" id="overallSearch" type="text" placeholder="Search name or team..." style="margin-bottom:12px;">
      <div class="incomplete-list" id="overallList" style="max-height:60vh;"></div>
      <div class="menu-status" style="margin-top:10px;">${subG.length} Sub G League player${subG.length===1?'':'s'} excluded from ranking, still included in the export.</div>
      <div style="margin-top:16px;">
        <button class="addplayer-save" id="overallSaveBtn">Download Overall Rankings</button>
        <span class="menu-status" id="overallStatus"></span>
      </div>
    </div>`;

  document.getElementById('overallList').innerHTML = rankable.length
    ? rankable.map((p, i) => {
        if (term && !p.name.toLowerCase().includes(term) && !(p.team || '').toLowerCase().includes(term)) return '';
        const tierInfo = TIER_INFO.find(t => t.value === getTierFor(p));
        return `
          <div class="final-card" data-id="${p.id}">
            <span class="rank-num">${i + 1}</span>
            <span class="cname">${p.name} <span style="color:#8A8A8A;font-weight:400;font-size:11px;">${p.position} — ${tierInfo ? tierInfo.label : ''}</span></span>
            <button class="nudge" data-dir="-1" data-id="${p.id}">&uarr;</button>
            <button class="nudge" data-dir="1" data-id="${p.id}">&darr;</button>
            <input class="jumpinput" type="number" placeholder="#" data-id="${p.id}">
          </div>`;
      }).join('')
    : `<div class="pane-empty">No players match.</div>`;

  document.getElementById('overallSearch').addEventListener('input', (e) => {
    overallSearchTerm = e.target.value;
    renderCompleteRankings();
  });

  document.querySelectorAll('#overallList .nudge').forEach(btn => {
    btn.addEventListener('click', () => {
      const rankableIds = rankable.map(p => p.id);
      const idx = rankableIds.indexOf(btn.dataset.id);
      const dir = Number(btn.dataset.dir);
      const swapWith = idx + dir;
      if (swapWith < 0 || swapWith >= rankableIds.length) return;
      const realIdx = userData.overallOrder.indexOf(btn.dataset.id);
      const realSwapIdx = userData.overallOrder.indexOf(rankableIds[swapWith]);
      [userData.overallOrder[realIdx], userData.overallOrder[realSwapIdx]] = [userData.overallOrder[realSwapIdx], userData.overallOrder[realIdx]];
      renderCompleteRankings();
    });
  });
  document.querySelectorAll('#overallList .jumpinput').forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const rankableIds = rankable.map(p => p.id);
      const target = Math.max(1, Math.min(rankableIds.length, parseInt(input.value, 10) || 1)) - 1;
      const fromIdx = rankableIds.indexOf(input.dataset.id);
      const [movedId] = rankableIds.splice(fromIdx, 1);
      rankableIds.splice(target, 0, movedId);
      // Sub G League always stays appended after — rebuild in that order.
      userData.overallOrder = [...rankableIds, ...subG.map(p => p.id)];
      renderCompleteRankings();

    downloadJson(`blindrank_${currentUser}.json`, userData);

  document.getElementById('prevBtn').addEventListener('click', () => { if (pos.cursor > 0) { pos.cursor--; renderRankingScreen(); } });
  document.getElementById('saveProgressLink').addEventListener('click', () => saveProgress(document.getElementById('rankStatus')));
  document.querySelectorAll('.switch-pos-link').forEach(a => {
    a.addEventListener('click', () => { currentPos = a.dataset.pos; renderRankingScreen(); });
  });
  document.getElementById('openTierRefine').addEventListener('click', () => openTierRefine(pos));
}

// ---- Within-tier refinement: reorder players inside a tier bucket ----
// Stays anonymized (by session number, same as the main flow) rather than by
// name, consistent with the tool's whole blind-ranking premise.
let refineActiveTier = 0;
function openTierRefine(pos) {
  refineActiveTier = 0;
  pos.tierOrder = pos.tierOrder || {};
  const overlay = document.getElementById('tierRefineOverlay');
  overlay.classList.add('open');
  renderTierRefine(pos);
}
function closeTierRefine() {
  document.getElementById('tierRefineOverlay').classList.remove('open');
}
function renderTierRefine(pos) {
  const overlay = document.getElementById('tierRefineOverlay');
  // Players currently in each tier, in existing tierOrder if set, else the
  // order they were tiered in.
  const idsInTier = (tierVal) => Object.keys(pos.tiers).filter(id => pos.tiers[id] === tierVal);
  TIER_INFO.forEach(t => {
    const existing = pos.tierOrder[t.value] || [];
    const current = idsInTier(t.value);
    const merged = existing.filter(id => current.includes(id));
    current.forEach(id => { if (!merged.includes(id)) merged.push(id); });
    pos.tierOrder[t.value] = merged;
  });

  const activeIds = pos.tierOrder[refineActiveTier] || [];
  overlay.innerHTML = `
    <div class="tier-refine-box">
      <h3>Refine Rankings Within Tiers</h3>
      <div class="sub">Drag to set order within a tier — this is separate from the tier itself, matching Rank Within Tier on the main site. Players are still shown by number, not name.</div>
      <div class="tier-refine-tabs">
        ${TIER_INFO.map(t => `<button class="tier-refine-tab ${t.value === refineActiveTier ? 'active' : ''}" data-tier="${t.value}">${t.label} (${(pos.tierOrder[t.value]||[]).length})</button>`).join('')}
      </div>
      <div class="tier-refine-list" id="tierRefineList">
        ${activeIds.length
          ? activeIds.map((id, i) => `<div class="tier-refine-row" draggable="true" data-id="${id}"><span class="refine-rank">${i+1}</span>Player #${pos.order.indexOf(id) + 1}</div>`).join('')
          : `<div class="tier-refine-empty">No players in this tier yet.</div>`}
      </div>
      <button class="tier-refine-close" id="tierRefineCloseBtn">Done</button>
    </div>`;

  overlay.querySelectorAll('.tier-refine-tab').forEach(btn => {
    btn.addEventListener('click', () => { refineActiveTier = Number(btn.dataset.tier); renderTierRefine(pos); });
  });
  overlay.querySelector('#tierRefineCloseBtn').addEventListener('click', closeTierRefine);

  let draggingId = null;
  overlay.querySelectorAll('.tier-refine-row').forEach(row => {
    row.addEventListener('dragstart', () => { draggingId = row.dataset.id; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      overlay.querySelectorAll('.drag-over').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const toId = row.dataset.id;
      if (draggingId === toId) return;
      const arr = pos.tierOrder[refineActiveTier];
      const fromIdx = arr.indexOf(draggingId), toIdx = arr.indexOf(toId);
      const [moved] = arr.splice(fromIdx, 1);
      arr.splice(toIdx, 0, moved);
      renderTierRefine(pos);
    });
  });
}

// ---- Boot ----
function fetchJsonOrThrow(path) {
  return fetch(path + '?v=' + Date.now()).then(r => {
    if (!r.ok) throw new Error(`${path} returned HTTP ${r.status} — check it exists at that exact path in the repo`);
    return r.json().catch(() => { throw new Error(`${path} responded but wasn't valid JSON`); });
  });
}
Promise.all([
  fetchJsonOrThrow(PLAYERS_INDEX_PATH),
  fetchJsonOrThrow(PLAYERS_DETAIL_PATH),
  fetchJsonOrThrow(USERS_PATH),
]).then(([indexData, detailData, users]) => {
  const detailById = new Map(detailData.map(d => [d.id, d]));
  allPlayers = indexData.map(p => ({ ...p, ...(detailById.get(p.id) || {}) }));
  renderLogin(users);
}).catch(err => {
  document.getElementById('app').innerHTML = `<div class="login-wrap">Could not load data: ${err.message}</div>`;
});
</script>
