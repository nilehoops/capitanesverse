name: Explore ESPN NBA Teams/Rosters (utility, run as needed)

on:
  workflow_dispatch: {}

jobs:
  explore-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run NBA team/roster/headshot lookup
        run: python scripts/explore_espn_nba.py
