<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capitanesverse — 2026 Offseason Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000000;
    color: #ECECEC;
    font-family: 'Lora', serif;
    font-weight: 700;
  }
  a { color: inherit; text-decoration: none; }
  a:hover .rank-name { text-decoration: underline; }

  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 24px 24px 8px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .wordmark {
    font-size: clamp(44px, 9vw, 118px);
    line-height: 0.95;
    margin: 0;
  }
  .search-line {
    margin-top: 10px;
  }
  .search-line input {
    background: transparent;
    border: none;
    border-bottom: 2px solid #ECECEC;
    color: #ECECEC;
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 20px;
    padding: 4px 2px;
    width: min(360px, 70vw);
  }
  .search-line input::placeholder { color: #9A9A9A; }
  .search-results {
    margin-top: 6px;
    font-size: 16px;
  }
  .search-results a { display: block; padding: 2px 0; }
  .search-results .pos { color: #9A9A9A; font-weight: 600; font-size: 13px; margin-left: 8px; }

  .roster-block {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .roster-label { font-size: 26px; line-height: 1.05; text-align: right; }
  .roster-photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    width: 130px;
  }
  .roster-photos img, .roster-photos .noimg {
    width: 63px;
    height: 63px;
    object-fit: cover;
    display: block;
    background: #1A1A1A;
  }
  .roster-photos .noimg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #6A6A6A;
  }
  .roster-names {
    font-size: 12px;
    font-weight: 600;
    margin-top: 4px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    width: 130px;
    text-align: center;
  }

  .boards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 28px 24px 60px;
    gap: 12px;
  }
  .board-title { font-size: 22px; border-bottom: 2px solid #ECECEC; padding-bottom: 4px; margin-bottom: 8px; }
  .board-title .showall { font-size: 13px; font-weight: 600; text-decoration: underline; margin-left: 8px; }
  .board-rows { max-height: 300px; overflow-y: auto; }
  .board-row { font-size: 19px; line-height: 1.5; display: block; }
  .board-row .n { margin-right: 6px; }
  .board-empty { font-size: 14px; font-weight: 400; color: #6A6A6A; }
  .roster-tag { background: #FFD400; color: #1631FF; padding: 0 3px; }

  .avail-toggle { padding: 4px 24px 14px; font-size: 17px; }
  .avail-toggle span { margin-right: 10px; }
  .avail-toggle button {
    background: none; border: none; color: #9A9A9A; font-family: 'Lora', serif;
    font-weight: 700; font-size: 17px; cursor: pointer; margin-right: 14px; padding: 2px 0;
  }
  .avail-toggle button.active { color: #ECECEC; border-bottom: 2px solid #ECECEC; }

  .notes-section { padding: 0 24px 60px; }
  .notes-title { font-size: 22px; border-bottom: 2px solid #ECECEC; padding-bottom: 4px; margin-bottom: 8px; }
  .notes-rows { max-height: 300px; overflow-y: auto; columns: 3; column-gap: 24px; }
  .notes-row { font-size: 16px; line-height: 1.6; break-inside: avoid; }
  .notes-row .note { font-size: 13px; font-weight: 400; color: #9A9A9A; margin-left: 6px; }

  .addplayer-section { padding: 0 24px 60px; }
  .addplayer-toggle {
    background: none; border: 1px solid #ECECEC; color: #ECECEC; font-family: 'Lora', serif;
    font-weight: 700; font-size: 16px; padding: 8px 16px; cursor: pointer;
  }
  .addplayer-form {
    display: none; margin-top: 16px; max-width: 640px;
    font-size: 15px; font-weight: 400;
  }
  .addplayer-form.open { display: block; }
  .addplayer-form label { display: block; font-weight: 700; font-size: 13px; margin: 10px 0 3px; }
  .addplayer-form input, .addplayer-form select {
    width: 100%; background: #000; color: #ECECEC; border: 1px solid #444;
    font-family: 'Lora', serif; font-size: 14px; padding: 6px;
  }
  .addplayer-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .addplayer-save {
    margin-top: 14px; font-family: 'Lora', serif; font-weight: 700; font-size: 14px;
    background: #ECECEC; color: #000; border: none; padding: 8px 16px; cursor: pointer;
  }
  .addplayer-status { font-size: 13px; font-weight: 400; color: #9A9A9A; margin-top: 8px; }
  .addplayer-group { margin-top: 16px; border-top: 1px solid #333; padding-top: 10px; }
  .addplayer-group-toggle {
    background: none; border: none; color: #ECECEC; font-family: 'Lora', serif;
    font-weight: 700; font-size: 14px; cursor: pointer; padding: 0;
  }
  .addplayer-group-body { display: none; margin-top: 10px; }
  .addplayer-group-body.open { display: block; }
  .addplayer-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .addplayer-stat-grid label { font-size: 11px; margin: 0 0 2px; }
  .addplayer-onroster { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 700; font-size: 13px; }
  .addplayer-onroster input { width: auto; }

  @media (max-width: 720px) {
    .boards { grid-template-columns: repeat(2, 1fr); }
    .notes-rows { columns: 1; }
  }
</style>
</head>
<body>

<div class="top">
  <div>
    <h1 class="wordmark">Capitanesverse</h1>
    <div class="search-line">
      <input id="searchInput" type="text" placeholder="Search:" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="roster-block">
    <div class="roster-label">Current<br>Roster</div>
    <div>
      <div class="roster-photos" id="rosterPhotos"></div>
      <div class="roster-names" id="rosterNames"></div>
    </div>
  </div>
</div>

<div class="avail-toggle" id="availToggle">
  <span>Available:</span>
  <button data-avail="yes">Yes</button>
  <button data-avail="no">No</button>
  <button data-avail="unknown">Unknown</button>
</div>

<div class="boards" id="boards"></div>

<div class="notes-section">
  <div class="notes-title">Availability Notes</div>
  <div class="notes-rows" id="notesRows"></div>
</div>

<div class="addplayer-section">
  <button class="addplayer-toggle" id="addPlayerToggle">+ Add Player</button>
  <div class="addplayer-form" id="addPlayerForm">
    <label>Name *</label>
    <input id="ap_name" type="text" placeholder="e.g. John Smith">

    <div class="addplayer-row3">
      <div>
        <label>Position *</label>
        <select id="ap_position">
          <option value="Guard">Guard</option>
          <option value="Wing">Wing</option>
          <option value="Big">Big</option>
        </select>
      </div>
      <div>
        <label>Team</label>
        <input id="ap_team" type="text" placeholder="e.g. Duke">
      </div>
      <div>
        <label>Class</label>
        <input id="ap_class" type="text" placeholder="e.g. Sr">
      </div>
    </div>

    <div class="addplayer-row3">
      <div>
        <label>Height</label>
        <input id="ap_height" type="text" placeholder="e.g. 6-5">
      </div>
      <div>
        <label>Overall Rank</label>
        <input id="ap_overallRank" type="number" placeholder="optional">
      </div>
      <div>
        <label>Positional Rank</label>
        <input id="ap_positionalRank" type="number" placeholder="optional">
      </div>
    </div>

    <div class="addplayer-row3">
      <div>
        <label>Latino</label>
        <select id="ap_latino">
          <option value="unknown">Unknown</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div>
        <label>Available</label>
        <select id="ap_availabilitySimple">
          <option value="unknown">Unknown</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div>
        <label>Availability Note</label>
        <input id="ap_availabilityNote" type="text" placeholder="optional">
      </div>
    </div>

    <label class="addplayer-onroster"><input id="ap_onRoster" type="checkbox"> On Current Roster</label>

    <div class="addplayer-group">
      <button type="button" class="addplayer-group-toggle" data-target="apg-bio">+ Biography</button>
      <div class="addplayer-group-body" id="apg-bio">
        <div class="addplayer-row3">
          <div><label>Age</label><input id="ap_age" type="number"></div>
          <div><label>Weight</label><input id="ap_weight" type="text" placeholder="e.g. 210 lbs"></div>
          <div><label>Agent</label><input id="ap_agent" type="text"></div>
        </div>
        <div class="addplayer-row3">
          <div><label>Hometown</label><input id="ap_hometown" type="text"></div>
          <div><label>High School</label><input id="ap_highSchool" type="text"></div>
          <div><label>Photo URL</label><input id="ap_photoUrl" type="text" placeholder="hotlink URL"></div>
        </div>
        <label>Current Status</label>
        <input id="ap_currentStatus" type="text" placeholder="e.g. Mexico City Capitanes, G League">
      </div>
    </div>

    <div class="addplayer-group">
      <button type="button" class="addplayer-group-toggle" data-target="apg-stats">+ Core Stats</button>
      <div class="addplayer-group-body" id="apg-stats">
        <div class="addplayer-stat-grid" id="apStatGrid"></div>
      </div>
    </div>

    <div class="addplayer-group">
      <button type="button" class="addplayer-group-toggle" data-target="apg-adv">+ Advanced Metrics</button>
      <div class="addplayer-group-body" id="apg-adv">
        <div class="addplayer-stat-grid" id="apAdvGrid"></div>
      </div>
    </div>

    <button class="addplayer-save" id="addPlayerSave">Save Player</button>
    <div class="addplayer-status" id="addPlayerStatus"></div>
  </div>
</div>

<script>
// Current roster — hotlinked directly from ESPN's headshot CDN, same technique
// the original draft-guide site used (no image is re-hosted, just referenced).
// Agapy Santos plays in Brazil's NBB, not ESPN's NCAA system, so there's no
// ESPN headshot to hotlink — his cell falls back to a blank tile.
const ROSTER = [
  { name: "Aly Khalifa",       id: "aly-khalifa",       photo: "https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/4702739.png" },
  { name: "Chad Baker-Mazara", id: "chad-baker-mazara", photo: "https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/4700877.png" },
  { name: "Terri Miller Jr.",  id: "terri-miller-jr",   photo: "https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/5175976.png" },
  { name: "Agapy Santos",      id: null,                photo: null },
];

function renderRoster() {
  document.getElementById('rosterPhotos').innerHTML = ROSTER.map(r =>
    r.photo ? `<img src="${r.photo}" alt="${r.name}">` : `<div class="noimg">?</div>`
  ).join('');
  document.getElementById('rosterNames').innerHTML = ROSTER.map(r => {
    const inner = `<span class="roster-tag">${r.name.split(' ')[0]}</span>`;
    return r.id ? `<a href="player.html?id=${r.id}">${inner}</a>` : `<span>${inner}</span>`;
  }).join('');
}

function nameHtml(p) {
  return p.onRoster ? `<span class="roster-tag">${p.name}</span>` : p.name;
}

function rankRow(rank, p) {
  return `<a class="board-row" href="player.html?id=${p.id}"><span class="n">${rank}.</span><span class="rank-name">${nameHtml(p)}</span></a>`;
}

function renderBoard(title, list, href) {
  const rows = list.length
    ? `<div class="board-rows">${list.map((p, i) => rankRow(i + 1, p)).join('')}</div>`
    : `<div class="board-empty">None yet.</div>`;
  return `<div><div class="board-title">${title}<a class="showall" href="${href}">(Show All)</a></div>${rows}</div>`;
}

// availabilitySimple ('yes'/'no'/'unknown') and availabilityNote are now real
// persisted fields (see player.html's editor), not derived here anymore.
let availFilter = null; // null = no filter (show everyone)
let cachedPlayers = null;

function withAvail(href) {
  return !availFilter ? href : href + (href.includes('?') ? '&' : '?') + 'availability=' + availFilter;
}

function renderBoards(players) {
  let pool = players;
  if (availFilter) pool = pool.filter(p => p.availabilitySimple === availFilter);

  const overall = pool.filter(p => p.overallRank != null).sort((a, b) => a.overallRank - b.overallRank);
  const latino = pool.filter(p => p.latino === true && p.overallRank != null).sort((a, b) => a.overallRank - b.overallRank);
  const byPos = (pos) => pool.filter(p => p.position === pos && p.positionalRank != null).sort((a, b) => a.positionalRank - b.positionalRank);

  document.getElementById('boards').innerHTML = [
    renderBoard('Overall Ranks:', overall, withAvail('rankings.html?pos=overall')),
    renderBoard('Latino Ranks:', latino, withAvail('rankings.html?pos=overall&latino=yes')),
    renderBoard('Guard Ranks:', byPos('Guard'), withAvail('rankings.html?pos=guard')),
    renderBoard('Wing Ranks:', byPos('Wing'), withAvail('rankings.html?pos=wing')),
    renderBoard('Big Ranks:', byPos('Big'), withAvail('rankings.html?pos=big')),
  ].join('');
}

function renderNotes(players) {
  const withNotes = players
    .filter(p => p.availabilityNote)
    .sort((a, b) => (a.overallRank ?? 999) - (b.overallRank ?? 999));

  document.getElementById('notesRows').innerHTML = withNotes.length
    ? withNotes.map(p =>
        `<a class="board-row notes-row" href="player.html?id=${p.id}">${nameHtml(p)}<span class="note">${p.availabilityNote}</span></a>`
      ).join('')
    : '<div class="board-empty">No notes yet.</div>';
}

document.querySelectorAll('#availToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.avail;
    const turningOff = availFilter === val;
    availFilter = turningOff ? null : val;
    document.querySelectorAll('#availToggle button').forEach(b => b.classList.remove('active'));
    if (!turningOff) btn.classList.add('active');
    if (cachedPlayers) renderBoards(cachedPlayers);
  });
});

function setupSearch(players) {
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.innerHTML = ''; return; }
    const matches = players.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
    results.innerHTML = matches.map(p =>
      `<a href="player.html?id=${p.id}">${nameHtml(p)}<span class="pos">${p.position || ''}${p.team ? ' · ' + p.team : ''}</span></a>`
    ).join('') || `<div class="board-empty">No matches.</div>`;
  });
}

// ---- Add Player: commits a new player object directly to GitHub, same
// mechanism as the Availability/Video editors on player.html. ----
const REPO_OWNER = 'nilehoops';
const REPO_NAME = 'capitanesverse';
const DATA_PATH_IN_REPO = 'data/players.json';

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

let githubToken = null; // held in memory only for this page load — never stored

function slugify(name) {
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

const STAT_LABELS = {
  gp:"GP", minPct:"Min%", prpg:"PRPG!", dPrpg:"D-PRPG", bpm:"BPM", obpm:"OBPM", dbpm:"DBPM",
  ortg:"ORtg", drtg:"D-Rtg", usg:"Usg", efg:"eFG", ts:"TS", orb:"OR", drb:"DR", ast:"Ast",
  tov:"TO", astToRatio:"A/TO", blk:"Blk", stl:"Stl", ftr:"FTR", fc40:"FC/40",
  dunks:"Dunks", dunkAttempts:"Dunk Att", dunkPct:"Dunk%", rimMakes:"Rim M", rimAttempts:"Rim A",
  rimPct:"Rim%", nonRim2Makes:"NonRim2 M", nonRim2Attempts:"NonRim2 A", nonRim2Pct:"NonRim2%",
  ftMakes:"FT", ftAttempts:"FTA", ftPct:"FT%", twoPM:"2PM", twoPA:"2PA", twoPct:"2P%",
  threePRate:"3PR", threePer100:"3P/100", threePM:"3P", threePA:"3PA", threePct:"3P%", fga:"FGA",
};
const ADV_LABELS = {
  ftrPctile:"FTR %ile (src)", threePARPctile:"3PAR %ile (src)", dunkRate:"Dunk Rate",
  dunksPerRimAtt:"Dunks/Rim Att", rimRate:"Rim Rate", rimRatePctile:"Rim Rate %ile (src)",
  rimToNonRim2Ratio:"Rim:NonRim2", moreyballPct:"Moreyball%", moreyballPctile:"Moreyball %ile (src)",
  griftRate:"Grift Rate", griftRatePctile:"Grift %ile (src)", jumperRate:"Jumper Rate",
};

document.getElementById('apStatGrid').innerHTML = Object.entries(STAT_LABELS).map(([key, label]) =>
  `<div><label>${label}</label><input type="number" step="any" data-stat="${key}"></div>`
).join('');
document.getElementById('apAdvGrid').innerHTML = Object.entries(ADV_LABELS).map(([key, label]) =>
  `<div><label>${label}</label><input type="number" step="any" data-adv="${key}"></div>`
).join('');

document.querySelectorAll('.addplayer-group-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.target).classList.toggle('open');
  });
});

function parseHeight(input) {
  const m = input.trim().match(/^(\d+)[-'](\d{1,2})/);
  if (!m) return { heightIn: null, heightDisplay: null };
  const feet = parseInt(m[1], 10), inches = parseInt(m[2], 10);
  return { heightIn: feet * 12 + inches, heightDisplay: `${feet}'${inches}"` };
}

async function addPlayerToGitHub(newPlayer) {
  if (!githubToken) {
    githubToken = prompt(
      'GitHub personal access token (Contents: read/write on this repo).\n' +
      'Only used for this save, kept in memory only, never stored.'
    );
    if (!githubToken) return { ok: false, message: 'Cancelled — no token entered.' };
  }

  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH_IN_REPO}`;
  const headers = { 'Authorization': `Bearer ${githubToken}`, 'Accept': 'application/vnd.github+json' };

  try {
    const getResp = await fetch(apiUrl, { headers });
    if (!getResp.ok) return { ok: false, message: `Could not read file (${getResp.status}). Check token permissions.` };
    const fileData = await getResp.json();
    const allPlayers = JSON.parse(base64ToUtf8(fileData.content));

    if (allPlayers.some(p => p.id === newPlayer.id)) {
      return { ok: false, message: `A player with id "${newPlayer.id}" already exists — pick a different name or edit that player instead.` };
    }
    allPlayers.push(newPlayer);

    const putResp = await fetch(apiUrl, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Add player: ${newPlayer.name}`,
        content: utf8ToBase64(JSON.stringify(allPlayers, null, 2)),
        sha: fileData.sha,
      }),
    });
    if (!putResp.ok) {
      const err = await putResp.json().catch(() => ({}));
      return { ok: false, message: `Save failed (${putResp.status}): ${err.message || 'unknown error'}` };
    }
    return { ok: true, message: 'Saved — live site updates in ~1 min.' };
  } catch (e) {
    return { ok: false, message: `Network error: ${e.message}` };
  }
}

document.getElementById('addPlayerToggle').addEventListener('click', () => {
  document.getElementById('addPlayerForm').classList.toggle('open');
});

document.getElementById('addPlayerSave').addEventListener('click', async () => {
  const status = document.getElementById('addPlayerStatus');
  const name = document.getElementById('ap_name').value.trim();
  if (!name) { status.textContent = 'Name is required.'; return; }

  const { heightIn, heightDisplay } = parseHeight(document.getElementById('ap_height').value);
  const overallRankVal = document.getElementById('ap_overallRank').value;
  const positionalRankVal = document.getElementById('ap_positionalRank').value;
  const latinoVal = document.getElementById('ap_latino').value;
  const availSimple = document.getElementById('ap_availabilitySimple').value;

  // Empty stats/advanced objects match the shape every other player has —
  // downstream code already treats a missing stat as null-equivalent —
  // but real values entered in the collapsible sections are used if present.
  const STAT_KEYS = Object.keys(STAT_LABELS);
  const ADV_KEYS = Object.keys(ADV_LABELS);
  const numOrNull = (el) => el.value.trim() === '' ? null : Number(el.value);

  const statsObj = Object.fromEntries(
    STAT_KEYS.map(k => [k, numOrNull(document.querySelector(`[data-stat="${k}"]`))])
  );
  const advancedObj = Object.fromEntries(
    ADV_KEYS.map(k => [k, numOrNull(document.querySelector(`[data-adv="${k}"]`))])
  );

  const age = document.getElementById('ap_age').value.trim();
  const weight = document.getElementById('ap_weight').value.trim();
  const agent = document.getElementById('ap_agent').value.trim();
  const hometown = document.getElementById('ap_hometown').value.trim();
  const highSchool = document.getElementById('ap_highSchool').value.trim();
  const currentStatus = document.getElementById('ap_currentStatus').value.trim();
  const photoUrl = document.getElementById('ap_photoUrl').value.trim();
  const hasBio = age || weight || agent || hometown || highSchool || currentStatus;
  const biography = hasBio ? {
    found: true, source: 'manual-entry',
    age: age ? Number(age) : null,
    weight: weight || null,
    agent: agent || null,
    hometown: hometown || null,
    highSchool: highSchool || null,
    currentStatus: currentStatus || null,
  } : null;

  const newPlayer = {
    id: slugify(name),
    name,
    position: document.getElementById('ap_position').value,
    team: document.getElementById('ap_team').value.trim() || null,
    conf: null,
    class: document.getElementById('ap_class').value.trim() || null,
    heightIn, heightDisplay,
    overallRank: overallRankVal ? Number(overallRankVal) : null,
    positionalRank: positionalRankVal ? Number(positionalRankVal) : null,
    tier: null, tierLabel: null, rankWithinTier: null,
    availability: null, availabilityLabel: null,
    availabilitySimple: availSimple,
    availabilityNote: document.getElementById('ap_availabilityNote').value.trim() || null,
    latino: latinoVal === 'yes' ? true : latinoVal === 'no' ? false : null,
    rk: null,
    stats: statsObj,
    advanced: advancedObj,
    biography,
    onRoster: document.getElementById('ap_onRoster').checked,
    photoUrl: photoUrl || null,
    videos: [],
  };

  status.textContent = 'Saving...';
  const result = await addPlayerToGitHub(newPlayer);
  status.textContent = result.message;
  if (result.ok) {
    ['ap_name','ap_team','ap_class','ap_height','ap_overallRank','ap_positionalRank','ap_availabilityNote',
     'ap_age','ap_weight','ap_agent','ap_hometown','ap_highSchool','ap_currentStatus','ap_photoUrl']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('ap_onRoster').checked = false;
    document.querySelectorAll('#apStatGrid input, #apAdvGrid input').forEach(el => el.value = '');
  }
});

renderRoster();
fetch('data/players.json?v=' + Date.now())
  .then(r => r.json())
  .then(players => { cachedPlayers = players; renderBoards(players); renderNotes(players); setupSearch(players); })
  .catch(err => {
    console.error('Could not load data/players.json', err);
    document.getElementById('boards').innerHTML = '<div class="board-empty">Could not load data/players.json.</div>';
  });
</script>
</body>
</html>
