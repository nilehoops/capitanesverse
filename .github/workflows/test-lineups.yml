name: Test G League Lineup Endpoints

on:
  workflow_dispatch: {}

jobs:
  test-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the lineup endpoint test
        run: python test_gleague_lineups.py
