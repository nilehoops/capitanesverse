name: Fetch Player Videos

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 6am UTC — adjust as you like
  workflow_dispatch: {}    # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch videos for each player
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_videos.py

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update player video links'
          file_pattern: data/players.json
