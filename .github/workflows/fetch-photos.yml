name: Fetch Player Photos

on:
  workflow_dispatch: {}    # manual "Run workflow" button only — no automatic schedule

permissions:
  contents: write

jobs:
  fetch-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest before running (in case anything changed since checkout)
        run: git pull origin main

      - name: Fetch photos for each player
        run: python scripts/fetch_photos.py

      - name: Pull latest changes before committing
        run: git pull --rebase origin main

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update player photos'
          file_pattern: data/players.json
