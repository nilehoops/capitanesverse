<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G League Team Scouting Profile</title>
<link href="https://googleapis.com" rel="stylesheet">
<link rel="stylesheet" href="inseason.css">
<style>
  body { margin:0; padding:8px 12px; background:var(--bg); color:var(--text); }
  .tm-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; border-bottom:2px solid var(--blue); padding-bottom:6px; margin-bottom:8px; gap:8px; }
  .tm-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:var(--blue); line-height:1.1; }
  .tm-nav { display:flex; gap:10px; align-items:center; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; }
  .tm-macro { display:flex; flex-wrap:wrap; gap:14px; background:var(--surface); border:1px solid var(--border); padding:6px 10px; margin-bottom:8px; font-size:11px; align-items:center; }
  .tm-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; align-items:start; }
  .tm-card { border:1px solid var(--border); padding:7px 9px; background:var(--bg); }
  .tm-card-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--blue); margin-bottom:3px; }
  .tm-card-sub { font-size:10px; font-weight:600; color:var(--dim); margin-bottom:6px; }
  .tm-shot-wrap { display:flex; gap:8px; align-items:flex-start; }
  .tm-svg-box { flex:0 0 46%; max-width:280px; }
  .tm-tbl-box { flex:1; min-width:0; overflow-x:auto; }
  .rot-game { border-top:1px solid var(--border); padding-top:5px; margin-top:5px; }
  .rot-row { display:flex; align-items:center; gap:6px; margin-bottom:2px; font-size:9.5px; }
  .rot-pname { width:105px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .rot-track { flex:1; height:10px; background:var(--surface); border:1px solid var(--border); position:relative; }
  .rot-bar { position:absolute; top:0; bottom:0; background:var(--blue); opacity:0.85; }
  @media (max-width: 1050px) { .tm-grid-2, .tm-shot-wrap { grid-template-columns:1fr; flex-direction:column; } }
</style>
</head>
<body>
<div class="tm-head">
  <div><div id="tmName" class="tm-title">Loading Team Scouting Profile...</div><div id="tmSub" style="font-size:11px;color:var(--dim);font-weight:600;"></div></div>
  <div class="tm-nav">
    <select id="tmSeason" onchange="loadTeamProfile()" style="font-family:'Lora',serif;font-size:11px;padding:2px 6px;border:1px solid var(--border);"><option value="2026-27" selected>2026-27</option><option value="2025-26">2025-26</option></select>
    <select id="tmPicker" onchange="switchTeam(this.value)" style="font-family:'Lora',serif;font-size:11px;padding:2px 6px;border:1px solid var(--border);"></select>
    <a href="shotcharts.html" style="color:var(--blue);">MXC Deep Shot Charts</a>
    <a href="inseason.html" style="color:var(--blue);">Dashboard</a>
    <a href="index.html" style="color:var(--muted);">← Home</a>
  </div>
</div>
<div id="tmMacro" class="tm-macro"></div>
<div id="tmBody"></div>
<script>
const ZONES_CFG = {
  "Restricted Area":        { lx: 0,    ly: 18,  path: "M -40 -47.5 L -40 0 A 40 40 0 0 0 40 0 L 40 -47.5 Z" },
  "Paint (Non-RA)":         { lx: 0,    ly: 98,  path: "M -80 -47.5 L -80 142.5 L 80 142.5 L 80 -47.5 L 40 -47.5 L 40 0 A 40 40 0 0 1 -40 0 L -40 -47.5 Z" },
  "Left Baseline Mid":      { lx: -145, ly: 20,  path: "M -220 -47.5 L -80 -47.5 L -80 85 L -220 85 Z" },
  "Right Baseline Mid":     { lx: 145,  ly: 20,  path: "M 80 -47.5 L 220 -47.5 L 220 85 L 80 85 Z" },
  "Left Elbow / Wing Mid":  { lx: -135, ly: 145, path: "M -220 85 L -80 85 L -80 142.5 L -75 225 L -165 170 A 237.5 237.5 0 0 1 -220 92.5 Z" },
  "Right Elbow / Wing Mid": { lx: 135,  ly: 145, path: "M 80 85 L 220 85 L 220 92.5 A 237.5 237.5 0 0 1 165 170 L 75 225 L 80 142.5 Z" },
  "Center Mid-Range":       { lx: 0,    ly: 190, path: "M -80 142.5 L 80 142.5 L 75 225 A 237.5 237.5 0 0 1 -75 225 Z" },
  "Left Corner 3":          { lx: -235, ly: 22,  path: "M -250 -47.5 L -220 -47.5 L -220 92.5 L -250 92.5 Z" },
  "Right Corner 3":         { lx: 235,  ly: 22,  path: "M 220 -47.5 L 250 -47.5 L 250 92.5 L 220 92.5 Z" },
  "Left Wing 3":            { lx: -175, ly: 255, path: "M -250 92.5 L -220 92.5 A 237.5 237.5 0 0 0 -165 170 L -85 222 L -115 422.5 L -250 422.5 Z" },
  "Right Wing 3":           { lx: 175,  ly: 255, path: "M 220 92.5 L 250 92.5 L 250 422.5 L 115 422.5 L 85 222 L 165 170 A 237.5 237.5 0 0 0 220 92.5 Z" },
  "Center / Top 3":         { lx: 0,    ly: 300, path: "M -85 222 A 237.5 237.5 0 0 0 85 222 L 115 422.5 L -115 422.5 Z" }
};
function getHeatColor(diff, isDef) {
  const d = isDef ? -diff : diff;
  if (d >= 5) return { fill: '#D81F2A', txt: '#FFFFFF' };
  if (d >= 2) return { fill: '#F07D7B', txt: '#111111' };
  if (d > -2) return { fill: '#EAECEF', txt: '#111111' };
  if (d > -5) return { fill: '#7BAFD4', txt: '#111111' };
  return { fill: '#004B8D', txt: '#FFFFFF' };
}
function switchTeam(val) {
  const url = new URL(window.location); url.searchParams.set('team', val); window.history.replaceState({}, '', url); loadTeamProfile();
}
function buildCourtCard(title, zonesObj, lgZones, statsObj, isDef) {
  let totA = 0;
  Object.values(zonesObj || {}).forEach(pair => { totA += (pair.slice(1, 2).pop() || 0); });
  const s = statsObj || {};
  const subLine = `2PT: <b>${s.fg2Pct ?? '—'}%</b> · 3PT: <b>${s.fg3Pct ?? '—'}%</b> · TS%: <b>${s.tsPct ?? '—'}%</b> · 3PAr: <b>${s.threePar ?? '—'}%</b> · FTr: <b>${s.ftr ?? '—'}%</b> · TOV%: <b>${s.tovPct ?? '—'}%</b>`;
  let poly = '', lbl = '', rows = '';
  Object.entries(ZONES_CFG).forEach(([z, cfg]) => {
    const pair = (zonesObj && zonesObj[z]) ? zonesObj[z] : new Array(0, 0);
    const lpair = (lgZones && lgZones[z]) ? lgZones[z] : new Array(0, 0);
    const m = pair.slice(0, 1).pop() || 0, a = pair.slice(1, 2).pop() || 0, lm = lpair.slice(0, 1).pop() || 0, la = lpair.slice(1, 2).pop() || 0;
    const pct = a > 0 ? (m / a) * 100 : 0, lgPct = la > 0 ? (lm / la) * 100 : 40, diff = a > 0 ? (pct - lgPct) : 0, share = totA > 0 ? (a / totA) * 100 : 0;
    const c = a > 0 ? getHeatColor(diff, isDef) : { fill: '#F4F4F4', txt: '#888' }, isCorner = z.includes('Corner');
    poly += `<path d="${cfg.path}" fill="${c.fill}" stroke="#FFFFFF" stroke-width="1.5"/>`;
    lbl += `<g transform="translate(${cfg.lx},${cfg.ly})" pointer-events="none"><text x="0" y="-3" text-anchor="middle" font-family="Oswald,sans-serif" font-size="${isCorner ? 12 : 15}" font-weight="700" fill="${c.txt}">${a ? pct.toFixed(1)+'%' : '—'}</text><text x="0" y="9" text-anchor="middle" font-family="Oswald,sans-serif" font-size="${isCorner ? 9 : 10.5}" font-weight="600" fill="${c.txt}">${isCorner ? share.toFixed(0)+'% sh' : m+'/'+a+' ('+share.toFixed(0)+'%)'}</text></g>`;
    const dGood = isDef ? (diff <= -2) : (diff >= 2), dBad = isDef ? (diff >= 2) : (diff <= -2);
    const dCol = dGood ? 'var(--green)' : (dBad ? 'var(--red)' : 'var(--dim)');
    rows += `<tr><td style="padding:2px 4px;border-bottom:1px solid var(--border);font-weight:600;">${z}</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;">${m}-${a}</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;">${a ? pct.toFixed(1)+'%' : '—'}</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;">${share.toFixed(1)}%</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;color:${dCol};font-weight:700;">${a ? (diff>=0?'+':'')+diff.toFixed(1)+'%' : '—'}</td></tr>`;
  });
  const court = `<g fill="none" stroke="#222" stroke-width="1.5"><rect x="-250" y="-47.5" width="500" height="470"/><rect x="-80" y="-47.5" width="160" height="190"/><circle cx="0" cy="142.5" r="60"/><path d="M -220 -47.5 L -220 92.5 A 237.5 237.5 0 0 0 220 92.5 L 220 -47.5"/><circle cx="0" cy="0" r="7.5" stroke="#D81F2A" stroke-width="2"/></g>`;
  return `<div class="tm-card"><div class="tm-card-title">${title}</div><div class="tm-card-sub">${subLine}</div><div class="tm-shot-wrap"><div class="tm-svg-box"><svg viewBox="-250 -47.5 500 470" style="width:100%;height:auto;display:block;border:1px solid var(--border);background:#FAFAFA;">${poly}${court}${lbl}</svg></div><div class="tm-tbl-box"><table style="width:100%;border-collapse:collapse;font-size:10px;"><thead><tr style="background:var(--surface);color:var(--muted);font-family:'Oswald',sans-serif;"><th style="padding:2px 4px;text-align:left;border-bottom:1px solid var(--border);">Zone</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">FGM-FGA</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">FG%</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">Share%</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">vs LG</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
}

function buildInsightsAndTov(active, lgZ) {
  const bullets = new Array(), o = active.offStats || {}, d = active.defStats || {};
  if (o.threePar >= 44) bullets.push(`<b>HIGH-VOLUME 3PT ATTACK:</b> Launches <b>${o.threePar}%</b> of shots from three (${o.fg3Pct}% 3PT).`);
  if (o.threePar && o.threePar <= 33) bullets.push(`<b>PAINT-HEAVY SHOT DIET:</b> Only <b>${o.threePar}%</b> 3PAr; attacks the interior (${o.fg2Pct}% 2PT, ${o.ftr}% FTr).`);
  if (o.tovPct >= 16.5) bullets.push(`<b>TURNOVER VULNERABILITY:</b> Commits turnovers on <b>${o.tovPct}%</b> of offensive possessions.`);
  if (d.tovPct >= 16.5) bullets.push(`<b>BALL-PRESSURE DEFENSE:</b> Forces opponent turnovers on <b>${d.tovPct}%</b> of defensive possessions.`);
  let bestOff = null, worstDef = null;
  Object.entries(ZONES_CFG).forEach(([z]) => {
    const op = (active.zones && active.zones[z]) ? active.zones[z] : new Array(0, 0), dp = (active.defZones && active.defZones[z]) ? active.defZones[z] : new Array(0, 0), lp = (lgZ && lgZ[z]) ? lgZ[z] : new Array(0, 0);
    const om = op.slice(0,1).pop()||0, oa = op.slice(1,2).pop()||0, dm = dp.slice(0,1).pop()||0, da = dp.slice(1,2).pop()||0, lm = lp.slice(0,1).pop()||0, la = lp.slice(1,2).pop()||0;
    const lgPct = la ? (lm/la)*100 : 40;
    if (oa >= 15) { const diff = (om/oa)*100 - lgPct; if (!bestOff || diff > bestOff.diff) bestOff = { z, pct: (om/oa)*100, diff }; }
    if (da >= 15) { const diff = (dm/da)*100 - lgPct; if (!worstDef || diff > worstDef.diff) worstDef = { z, pct: (dm/da)*100, diff }; }
  });
  if (bestOff && bestOff.diff >= 3.5) bullets.push(`<span style="color:var(--green);font-weight:700;">OFFENSIVE HOT ZONE:</span> Shoots <b>${bestOff.pct.toFixed(1)}%</b> in <b>${bestOff.z}</b> (<b>+${bestOff.diff.toFixed(1)}%</b> vs. LG).`);
  if (worstDef && worstDef.diff >= 3.5) bullets.push(`<span style="color:var(--red);font-weight:700;">DEFENSIVE VULNERABILITY:</span> Allows <b>${worstDef.pct.toFixed(1)}%</b> in <b>${worstDef.z}</b> (<b>+${worstDef.diff.toFixed(1)}%</b> vs. LG).`);
  if (active.heightPctile != null && active.heightPctile >= 75) bullets.push(`<b>SIZE ADVANTAGE:</b> Weighted roster height (<b>${active.avgHeight}</b>) ranks in the <b>${active.heightPctile}th percentile</b> league-wide.`);
  const roster = (active.rosterStats || new Array()).slice().sort((a, b) => (b.tov || 0) - (a.tov || 0));
  const totTov = roster.reduce((s, p) => s + (p.tov || 0), 0) || 1;
  const tovRows = roster.slice(0, 6).map(p => `<tr><td style="padding:2px 4px;border-bottom:1px solid var(--border);font-weight:600;">${p.name}</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;">${p.tov || 0}</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;">${p.tov75 ?? '—'}</td><td style="padding:2px 4px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;">${((p.tov || 0) / totTov * 100).toFixed(1)}%</td></tr>`).join('');
  return `<div class="tm-grid-2"><div class="tm-card" style="border-left:4px solid var(--blue);background:var(--surface);"><div class="tm-card-title">Insights</div><ul style="margin:4px 0 0 16px;padding:0;font-size:11px;line-height:1.45;">${(bullets.length ? bullets : new Array('Balanced shot distribution and efficiency across zones.')).map(b => `<li style="margin-bottom:3px;">${b}</li>`).join('')}</ul></div><div class="tm-card"><div class="tm-card-title">Turnover Breakdown &amp; Ball-Handler Share</div><div class="tm-card-sub">Team TOV%: <b>${o.tovPct ?? '—'}%</b> · Opponent Forced TOV%: <b>${d.tovPct ?? '—'}%</b></div><table style="width:100%;border-collapse:collapse;font-size:10px;"><thead><tr style="background:var(--surface);color:var(--muted);font-family:'Oswald',sans-serif;"><th style="padding:2px 4px;text-align:left;border-bottom:1px solid var(--border);">Player</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">TOV</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">TOV/75</th><th style="padding:2px 4px;text-align:right;border-bottom:1px solid var(--border);">Team TOV%</th></tr></thead><tbody>${tovRows}</tbody></table></div></div>`;
}
function buildRotationsCard(active) {
  const games = active.last5Rotations || new Array();
  if (!games.length) return '';
  const gamesHtml = games.map(g => {
    const byPlayer = {};
    (g.stints || new Array()).forEach(st => { if (!byPlayer[st.player]) byPlayer[st.player] = new Array(); byPlayer[st.player].push(st); });
    const pRows = Object.entries(byPlayer).slice(0, 10).map(([pname, stints]) => {
      const bars = stints.map(s => { const left = Math.max(0, Math.min(100, (s.in / 48) * 100)); const width = Math.max(1, Math.min(100 - left, ((s.out - s.in) / 48) * 100)); return `<div class="rot-bar" style="left:${left}%;width:${width}%;" title="${s.in}m–${s.out}m (${s.pm>=0?'+':''}${s.pm})"></div>`; }).join('');
      const totPm = stints.reduce((a, b) => a + (b.pm || 0), 0);
      return `<div class="rot-row"><div class="rot-pname">${pname}</div><div class="rot-track">${bars}</div><div style="width:28px;text-align:right;font-weight:700;color:${totPm>=0?'var(--green)':'var(--red)'};">${totPm>=0?'+':''}${totPm}</div></div>`;
    }).join('');
    return `<div class="rot-game"><div style="font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:3px;">${g.date} · ${g.matchup} (${g.wl})</div>${pRows}</div>`;
  }).join('');
  return `<div class="tm-card" style="margin-bottom:8px;"><div class="tm-card-title">Last 5 Games Rotation Timeline (48-Min Stints &amp; +/-)</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;">${gamesHtml}</div></div>`;
}

function buildRosterTable(active, nameToId) {
  const rows = (active.rosterStats || new Array()).map(p => {
    const pid = nameToId[p.name.toLowerCase()];
    const href = pid ? `player.html?id=${encodeURIComponent(pid)}` : `player.html?name=${encodeURIComponent(p.name)}`;
    const netCol = (p.netRtg || 0) >= 0 ? 'var(--green)' : 'var(--red)', ooCol = (p.onOff || 0) >= 0 ? 'var(--green)' : 'var(--red)';
    return `<tr><td style="padding:3px 5px;border-bottom:1px solid var(--border);font-weight:700;"><a href="${href}" style="color:var(--blue);text-decoration:none;">${p.name}</a></td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.age ?? '—'}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.height || '—'}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.weight ? Math.round(p.weight) : '—'}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.gp ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.mpg ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;">${p.pts75 ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.reb75 ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.ast75 ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.tov75 ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.stl75 ?? 0}/${p.blk75 ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.fgPct ?? 0}%</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.fg3Pct ?? 0}%</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;">${p.tsPct ?? 0}%</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;">${p.usg ?? 0}%</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;color:${netCol};">${(p.netRtg>=0?'+':'')}${p.netRtg ?? 0}</td><td style="padding:3px 5px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;color:${ooCol};">${(p.onOff>=0?'+':'')}${p.onOff ?? 0}</td></tr>`;
  }).join('');
  return `<div class="tm-card"><div class="tm-card-title">Roster Physicals, Per-75 Production, Shooting &amp; On/Off Impact</div><div class="tm-card-sub">Minute-Weighted Team Physicals: <b>Age ${active.avgAge ?? '—'}</b> (${active.agePctile ?? '—'}%ile) · <b>Height ${active.avgHeight ?? '—'}</b> (${active.heightPctile ?? '—'}%ile) · <b>Weight ${active.avgWeight ? active.avgWeight + ' lbs' : '—'}</b> (${active.weightPctile ?? '—'}%ile)</div><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:10.5px;"><thead><tr style="background:var(--surface);color:var(--muted);font-family:'Oswald',sans-serif;"><th style="padding:3px 5px;text-align:left;border-bottom:1px solid var(--border);">Player</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">Age</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">Ht</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">Wt</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">GP</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">MPG</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">PTS/75</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">REB/75</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">AST/75</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">TOV/75</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">STL/BLK</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">FG%</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">3P%</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">TS%</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">USG%</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">NetRtg</th><th style="padding:3px 5px;text-align:right;border-bottom:1px solid var(--border);">On-Off</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

async function loadTeamProfile() {
  const szn = document.getElementById('tmSeason').value;
  const queryTeam = (new URLSearchParams(window.location.search).get('team') || 'MXC').toLowerCase();
  const resps = await Promise.all(new Array(fetch(`data/league_lite_shots_${szn}.json?v=` + Date.now()), fetch(`data/players_index.json?v=` + Date.now())));
  const liteResp = resps.shift(), idxResp = resps.shift();
  if (!liteResp.ok) { document.getElementById('tmName').textContent = `No ${szn} team profile data available yet`; return; }
  const lite = await liteResp.json(), idx = idxResp.ok ? await idxResp.json() : new Array(), nameToId = {};
  (Array.isArray(idx) ? idx : Object.values(idx || {})).forEach(p => { if (p && p.name && p.id) nameToId[p.name.toLowerCase()] = p.id; });
  const teams = (lite.teams || new Array()).slice().sort((a, b) => a.name.localeCompare(b.name));
  const picker = document.getElementById('tmPicker');
  picker.innerHTML = teams.map(t => `<option value="${t.abbrev || t.id}">${t.name}</option>`).join('');
  const active = teams.find(t => (t.abbrev || '').toLowerCase() === queryTeam || t.id === queryTeam || t.name.toLowerCase().includes(queryTeam)) || teams.find(t => (t.abbrev || '') === 'MXC') || teams.slice(0, 1).pop();
  if (!active) return;
  picker.value = active.abbrev || active.id;
  const o = active.offStats || {}, d = active.defStats || {};
  const net = active.netRtg ?? ((o.rtg && d.rtg) ? (o.rtg - d.rtg).toFixed(1) : '—');
  document.getElementById('tmName').textContent = `${active.name} (${active.abbrev || ''}) — Team Scouting Profile`;
  document.getElementById('tmSub').textContent = `${szn} Season · Record: ${o.w ?? 0}-${o.l ?? 0} (${o.gp ?? 0} GP) · ORtg: ${o.rtg ?? '—'} · DRtg: ${d.rtg ?? '—'} · NetRtg: ${net >= 0 ? '+' : ''}${net}`;
  document.getElementById('tmMacro').innerHTML = `<div><b>Weighted Roster Age:</b> ${active.avgAge ?? '—'} <span style="color:var(--blue);font-weight:700;">(${active.agePctile ?? '—'}%ile)</span></div><div><b>Weighted Roster Height:</b> ${active.avgHeight ?? '—'} <span style="color:var(--blue);font-weight:700;">(${active.heightPctile ?? '—'}%ile)</span></div><div><b>Weighted Roster Weight:</b> ${active.avgWeight ? active.avgWeight + ' lbs' : '—'} <span style="color:var(--blue);font-weight:700;">(${active.weightPctile ?? '—'}%ile)</span></div>`;
  document.getElementById('tmBody').innerHTML = `<div class="tm-grid-2">${buildCourtCard('Offensive Shot Chart & Shooting Profile', active.zones, lite.leagueZones, o, false)}${buildCourtCard('Defensive Shot Chart & Opponent Allowed', active.defZones, lite.leagueZones, d, true)}</div>` + buildInsightsAndTov(active, lite.leagueZones) + buildRotationsCard(active) + buildRosterTable(active, nameToId);
}
loadTeamProfile();
</script>
</body>
</html>
