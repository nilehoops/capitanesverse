name: Fetch Staff Notes

on:
  schedule:
    - cron: '0 12 * * *'  # daily at 12:00 UTC
  workflow_dispatch: {}

jobs:
  fetch-staff-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      discussions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_staff_notes.py

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update staff notes feed"
          file_pattern: data/staff_notes.json
