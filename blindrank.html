<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Capitanes Talent Pool Ranking Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #ECECEC; font-family: 'Lora', serif; font-weight: 700; }
  a, button { color: inherit; cursor: pointer; }
  input { font-family: 'Lora', serif; }

  /* ---- Login ---- */
  .login-wrap { max-width: 360px; margin: 80px auto; text-align: center; padding: 0 20px; }
  .login-wrap h1 { font-size: 28px; margin-bottom: 24px; }
  .login-wrap input {
    width: 100%; background: #000; color: #ECECEC; border: 1px solid #444;
    font-size: 16px; padding: 8px; margin-bottom: 10px;
  }
  .login-wrap button {
    width: 100%; background: #ECECEC; color: #000; border: none;
    font-family: 'Lora', serif; font-weight: 700; font-size: 15px; padding: 10px; margin-top: 6px;
  }
  .login-error { color: #D81F2A; font-size: 13px; margin-top: 8px; font-weight: 400; }
  .adduser-toggle-row { margin-top: 20px; }
  .adduser-link { font-size: 13px; text-decoration: underline; cursor: pointer; color: #9A9A9A; }
  .adduser-form { display: none; margin-top: 12px; border-top: 1px solid #333; padding-top: 12px; }
  .adduser-form.open { display: block; }

  /* ---- Menu screen ---- */
  .menu-wrap { text-align: center; padding: 40px 20px; }
  .menu-title { font-size: clamp(28px, 5vw, 46px); margin-bottom: 6px; }
  .menu-sub { font-size: 20px; margin-bottom: 30px; }
  .pos-row { display: flex; justify-content: center; gap: 50px; flex-wrap: wrap; }
  .pos-btn { background: none; border: none; text-align: center; }
  .pos-btn .pos-name { font-size: clamp(48px, 9vw, 110px); line-height: 1; display: block; }
  .pos-btn .pos-progress { font-size: 13px; font-weight: 400; color: #9A9A9A; display: block; margin-top: 6px; }
  .menu-footer {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 900px; margin: 50px auto 0; padding: 0 10px; font-size: 15px; flex-wrap: wrap; gap: 10px;
  }
  .menu-footer button { background: none; border: none; font-family: 'Lora', serif; font-weight: 700; font-size: 15px; text-decoration: underline; }
  .menu-status { font-size: 12px; font-weight: 400; color: #9A9A9A; margin-top: 10px; }

  /* ---- Ranking screen ---- */
  .rank-grid { display: grid; grid-template-columns: 170px 1fr 320px; min-height: 100vh; }
  .rank-util { background: #000; padding: 14px; border-right: 1px solid #222; font-size: 15px; line-height: 1.7; }
  .rank-util a, .rank-util button { display: block; background: none; border: none; font-family: 'Lora', serif; font-weight: 700; font-size: 15px; padding: 0; text-align: left; }
  .rank-util .link-menu, .rank-util .link-save { color: #4FD1FF; text-decoration: underline; margin-bottom: 4px; }
  .rank-util .tally { font-size: 14px; margin-top: 10px; }
  .rank-util .link-skip { color: #3FCF5C; text-decoration: underline; margin-top: 12px; }

  .rank-video { background: #000; padding: 10px; }
  .rank-video iframe { width: 100%; height: 300px; border: 0; }
  .rank-video .novideo {
    height: 300px; border: 1px dashed #333; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #8A8A8A; text-align: center;
  }
  .rank-stats { grid-column: 1 / 3; background: #000; padding: 14px; border-top: 1px solid #222; }
  .rank-stats h2 { font-size: 26px; margin: 0 0 6px; }
  .rank-physicals { font-size: 16px; font-weight: 400; margin-bottom: 12px; }
  .rank-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px 14px; font-size: 13px; font-weight: 400; }
  .rank-stat-grid .k { color: #9A9A9A; }
  .rank-stat-grid .v { color: #ECECEC; font-weight: 600; }

  .rank-right { display: flex; flex-direction: column; }
  .sw-row { display: grid; grid-template-columns: 1fr 1fr; flex: 1; }
  .sw-box { padding: 14px; }
  .sw-box.strengths { background: #128A3E; }
  .sw-box.weaknesses { background: #D81F2A; }
  .sw-box .sw-title { font-size: 20px; margin-bottom: 8px; }
  .sw-box .sw-item { font-size: 14px; margin: 3px 0; display: flex; align-items: center; gap: 6px; }
  .sw-dot-row { display: flex; gap: 3px; }
  .sw-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ECECEC; flex-shrink: 0; }
  .sw-box .sw-empty { font-size: 12px; font-weight: 400; }

  .tier-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .tier-btn { border: none; padding: 26px 10px; font-family: 'Lora', serif; font-weight: 700; font-size: 22px; text-align: center; }
  .tier-allstar { background: #128A3E; color: #ECECEC; }
  .tier-rotation { background: #6A1B9A; color: #ECECEC; }
  .tier-starter { background: #1B4FBF; color: #ECECEC; }
  .tier-sub { background: #D81F2A; color: #ECECEC; }
  .tier-btn:hover { filter: brightness(1.15); }

  .rank-nav {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 26px;
    background: #000; border-top: 1px solid #222; padding: 14px; font-size: 18px;
  }
  .rank-nav button { background: none; border: none; font-family: 'Lora', serif; font-weight: 700; font-size: 18px; color: #6A1B9A; }
  .rank-nav .rank-nav-skip { color: #3FCF5C; text-decoration: underline; }
  .rank-nav .rank-nav-progress { color: #ECECEC; }

  .done-msg { grid-column: 1 / -1; text-align: center; padding: 60px 20px; font-size: 20px; }

  @media (max-width: 860px) {
    .rank-grid { grid-template-columns: 1fr; }
    .rank-stats { grid-column: 1; }
    .sw-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const REPO_OWNER = 'nilehoops';
const REPO_NAME = 'capitanesverse';
const PLAYERS_PATH = 'data/players.json';
const USERS_PATH = 'data/blindrank_users.json';
const userDataPath = (username) => `data/blind_rankings/${username}.json`;

// Visual order matches the wireframe's 2x2 grid exactly (top-left, top-right, bottom-left, bottom-right).
// Values (0-3) match the tier numbers already used elsewhere in this dataset.
const TIER_INFO = [
  { value: 0, label: 'G League All Star+', cls: 'tier-allstar' },
  { value: 2, label: 'G League Rotation',  cls: 'tier-rotation' },
  { value: 1, label: 'G League Starter',   cls: 'tier-starter' },
  { value: 3, label: 'Sub G League',       cls: 'tier-sub' },
];
const TIER_LABEL_BY_VALUE = Object.fromEntries(TIER_INFO.map(t => [t.value, t.label]));

const STAT_LABELS = {
  gp:"GP", minPct:"Min%", prpg:"PRPG!", bpm:"BPM", obpm:"OBPM", dbpm:"DBPM",
  ortg:"ORtg", drtg:"D-Rtg", usg:"Usg", efg:"eFG", ts:"TS", orb:"OR", drb:"DR", ast:"Ast",
  tov:"TO", blk:"Blk", stl:"Stl", ftr:"FTR", ftPct:"FT%", twoPct:"2P%", threePct:"3P%",
};
// Full stat set (not the smaller display grid below) — same broad list used
// on player.html's own Strengths/Weaknesses box.
const SW_LABELS = {
  minPct:"Min%", prpg:"PRPG!", dPrpg:"D-PRPG", bpm:"BPM", obpm:"OBPM", dbpm:"DBPM",
  ortg:"ORtg", drtg:"D-Rtg", usg:"Usg", efg:"eFG", ts:"TS", orb:"OR", drb:"DR", ast:"Ast",
  tov:"TO", astToRatio:"A/TO", blk:"Blk", stl:"Stl", ftr:"FTR", fc40:"FC/40",
  dunkPct:"Dunk%", rimPct:"Rim%", nonRim2Pct:"NonRim2%", ftPct:"FT%",
  twoPct:"2P%", threePRate:"3PR", threePct:"3P%",
};
const PERCENTILE_KEYS = Object.keys(SW_LABELS);
const LOWER_IS_BETTER = new Set(['tov', 'drtg', 'fc40']);

function percentileRank(players, position, key, value) {
  const peers = players.filter(p => p.position === position && p.stats[key] != null);
  if (peers.length < 5 || value == null) return null;
  const better = LOWER_IS_BETTER.has(key)
    ? peers.filter(p => p.stats[key] >= value).length
    : peers.filter(p => p.stats[key] <= value).length;
  return better / peers.length;
}
// Tankathon-style tiers: only stats clearing the lowest tier show at all —
// everything else is "average" and omitted, same thresholds as player.html.
function strengthTier(pct) {
  if (pct >= 0.97) return 4;
  if (pct >= 0.90) return 3;
  if (pct >= 0.80) return 2;
  if (pct >= 0.65) return 1;
  return 0;
}
function weaknessTier(pct) {
  if (pct <= 0.03) return 4;
  if (pct <= 0.10) return 3;
  if (pct <= 0.20) return 2;
  if (pct <= 0.35) return 1;
  return 0;
}
function topStrengthsWeaknesses(players, player) {
  const strengths = [], weaknesses = [];
  for (const key of PERCENTILE_KEYS) {
    const pct = percentileRank(players, player.position, key, player.stats[key]);
    if (pct == null) continue;
    const sTier = strengthTier(pct), wTier = weaknessTier(pct);
    if (sTier > 0) strengths.push({ label: SW_LABELS[key] || key, pct, tier: sTier });
    else if (wTier > 0) weaknesses.push({ label: SW_LABELS[key] || key, pct, tier: wTier });
  }
  strengths.sort((a, b) => b.tier - a.tier || b.pct - a.pct);
  weaknesses.sort((a, b) => b.tier - a.tier || a.pct - b.pct);
  return { strengths, weaknesses };
}
function dotsHtml(tier) { return '<span class="sw-dot-row">' + '<span class="sw-dot"></span>'.repeat(tier) + '</span>'; }


function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function computeDecimalAge(bio) {
  if (!bio) return null;
  if (bio.born && /^[A-Z][a-z]{2} \d{1,2}, \d{4}$/.test(bio.born.trim())) {
    const d = new Date(bio.born);
    if (!isNaN(d.getTime())) return ((Date.now() - d.getTime()) / (365.25 * 24 * 60 * 60 * 1000)).toFixed(1);
  }
  return bio.age != null ? Number(bio.age).toFixed(1) : null;
}

// ---- GitHub commit helpers (same pattern as the rest of the site) ----
let githubToken = null;
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = ''; bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function ensureToken() {
  if (!githubToken) {
    githubToken = prompt('GitHub personal access token (Contents: read/write on this repo).\nUsed only this session, never stored.');
  }
  return githubToken;
}
async function ghGetJson(path) {
  const token = ensureToken();
  if (!token) return { ok: false, notFound: false, data: null, sha: null };
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const resp = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
  if (resp.status === 404) return { ok: true, notFound: true, data: null, sha: null };
  if (!resp.ok) return { ok: false, notFound: false, data: null, sha: null };
  const fileData = await resp.json();
  return { ok: true, notFound: false, data: JSON.parse(base64ToUtf8(fileData.content)), sha: fileData.sha };
}
async function ghPutJson(path, obj, sha, message) {
  const token = ensureToken();
  if (!token) return { ok: false, message: 'No token entered.' };
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const body = { message, content: utf8ToBase64(JSON.stringify(obj, null, 2)) };
  if (sha) body.sha = sha;
  const resp = await fetch(url, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    return { ok: false, message: `Save failed (${resp.status}): ${err.message || 'unknown error'}` };
  }
  return { ok: true, message: 'Saved.' };
}

// Public, unauthenticated read — no token needed since this repo is public.
// This is the ONLY GitHub call the ranking flow makes for regular contributors;
// they never see a token prompt. Writing (see ghPutJson above) is owner-only,
// used solely by the "+ Add User" admin action.
async function fetchPublicJson(path) {
  const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${path}?v=${Date.now()}`;
  const resp = await fetch(url);
  if (resp.status === 404) return { ok: true, notFound: true, data: null };
  if (!resp.ok) return { ok: false, notFound: false, data: null };
  return { ok: true, notFound: false, data: await resp.json() };
}
function downloadJson(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// ---- App state ----
let allPlayers = [];
let currentUser = null;
let userData = null;     // { guard: {order,tiers,cursor}, wing:{...}, big:{...} }
let currentPos = null;   // 'guard' | 'wing' | 'big'
const POS_KEY_TO_LABEL = { guard: 'Guard', wing: 'Wing', big: 'Big' };

function freshPositionState(position) {
  const ids = shuffle(allPlayers.filter(p => p.position === POS_KEY_TO_LABEL[position]).map(p => p.id));
  return { order: ids, tiers: {}, cursor: 0 };
}

function rankedCount(posKey) {
  return Object.keys(userData[posKey].tiers).length;
}
function totalCount(posKey) {
  return userData[posKey].order.length;
}

// ---- Login screen ----
function renderLogin(users) {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <h1>2027 Capitanes<br>Talent Pool Ranking Creator</h1>
      <input id="loginUser" type="text" placeholder="Username">
      <input id="loginPin" type="text" maxlength="4" placeholder="4-character PIN">
      <button id="loginBtn">Log In</button>
      <div class="login-error" id="loginError"></div>

      <div class="adduser-toggle-row">
        <a id="addUserToggle" class="adduser-link">+ Add User</a>
      </div>
      <div class="adduser-form" id="addUserForm">
        <input id="newUser" type="text" placeholder="New username">
        <input id="newPin" type="text" maxlength="4" placeholder="4-character PIN">
        <button id="addUserBtn">Save User</button>
        <div class="login-error" id="addUserStatus"></div>
      </div>
    </div>`;

  document.getElementById('addUserToggle').addEventListener('click', () => {
    document.getElementById('addUserForm').classList.toggle('open');
  });

  document.getElementById('addUserBtn').addEventListener('click', async () => {
    const status = document.getElementById('addUserStatus');
    const newUser = document.getElementById('newUser').value.trim();
    const newPin = document.getElementById('newPin').value.trim();
    if (!newUser || newPin.length !== 4) { status.textContent = 'Enter a username and a 4-character PIN.'; return; }
    if (users[newUser]) { status.textContent = 'That username already exists.'; return; }

    status.textContent = 'Saving...';
    const result = await ghGetJson(USERS_PATH);
    if (!result.ok) { status.textContent = 'Could not reach GitHub — check your token.'; return; }
    const freshUsers = result.notFound ? {} : result.data;
    freshUsers[newUser] = newPin;
    const put = await ghPutJson(USERS_PATH, freshUsers, result.sha, `Add blind-rank user: ${newUser}`);
    status.textContent = put.ok ? 'Saved — you can log in now.' : put.message;
    if (put.ok) {
      users[newUser] = newPin;
      document.getElementById('newUser').value = '';
      document.getElementById('newPin').value = '';
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const u = document.getElementById('loginUser').value.trim();
    const pin = document.getElementById('loginPin').value.trim();
    const err = document.getElementById('loginError');
    if (!users[u] || users[u] !== pin) { err.textContent = 'Unknown username or wrong PIN.'; return; }
    err.textContent = 'Loading...';
    currentUser = u;
    const result = await fetchPublicJson(userDataPath(u));
    if (!result.ok) { err.textContent = 'Could not reach GitHub.'; return; }
    userData = result.notFound
      ? { guard: freshPositionState('guard'), wing: freshPositionState('wing'), big: freshPositionState('big') }
      : result.data;
    renderMenu();
  });
}

// ---- Menu screen ----
function renderMenu() {
  document.getElementById('app').innerHTML = `
    <div class="menu-wrap">
      <div class="menu-title">2027 Capitanes Talent Pool Ranking Creator</div>
      <div class="menu-sub">Select a position group to rank:</div>
      <div class="pos-row">
        <button class="pos-btn" data-pos="guard"><span class="pos-name">Guards</span><span class="pos-progress">${rankedCount('guard')}/${totalCount('guard')} Players</span></button>
        <button class="pos-btn" data-pos="wing"><span class="pos-name">Wings</span><span class="pos-progress">${rankedCount('wing')}/${totalCount('wing')} Players</span></button>
        <button class="pos-btn" data-pos="big"><span class="pos-name">Bigs</span><span class="pos-progress">${rankedCount('big')}/${totalCount('big')} Players</span></button>
      </div>
      <div class="menu-footer">
        <span>User: ${currentUser}</span>
        <div>
          <button id="downloadBtn">Download My Rankings</button>
          <button id="loadBtn">Load Previous Rankings</button>
          <button id="clearBtn">Clear Current Rankings</button>
        </div>
      </div>
      <div class="menu-status" id="menuStatus"></div>
    </div>`;

  document.querySelectorAll('.pos-btn').forEach(btn => {
    btn.addEventListener('click', () => { currentPos = btn.dataset.pos; renderRankingScreen(); });
  });
  document.getElementById('downloadBtn').addEventListener('click', () => {
    downloadJson(`blindrank_${currentUser}.json`, userData);
    document.getElementById('menuStatus').textContent =
      `Downloaded. Send this file to the site owner to upload to data/blind_rankings/${currentUser}.json`;
  });
  document.getElementById('loadBtn').addEventListener('click', async () => {
    const status = document.getElementById('menuStatus');
    status.textContent = 'Loading...';
    const result = await fetchPublicJson(userDataPath(currentUser));
    if (result.ok && !result.notFound) { userData = result.data; renderMenu(); }
    else status.textContent = 'No saved progress found on GitHub yet — the owner may not have uploaded your last download.';
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Clear ALL current rankings for this user? This only affects what\'s in your browser right now — anything already uploaded to GitHub is unaffected.')) return;
    userData = { guard: freshPositionState('guard'), wing: freshPositionState('wing'), big: freshPositionState('big') };
    renderMenu();
  });
}

function saveProgress(statusEl) {
  downloadJson(`blindrank_${currentUser}.json`, userData);
  if (statusEl) statusEl.textContent = `Downloaded — send to the site owner to upload.`;
}

// ---- Ranking screen ----
function renderRankingScreen() {
  const pos = userData[currentPos];
  const app = document.getElementById('app');

  if (pos.cursor >= pos.order.length) {
    app.innerHTML = `
      <div class="rank-grid">
        <div class="done-msg">
          You've been through every ${POS_KEY_TO_LABEL[currentPos]}. ${rankedCount(currentPos)}/${totalCount(currentPos)} ranked.<br>
          <button onclick="renderMenu()" style="margin-top:16px;text-decoration:underline;background:none;border:none;font-family:'Lora',serif;font-weight:700;font-size:16px;">Back to Main Menu</button>
        </div>
      </div>`;
    return;
  }

  const playerId = pos.order[pos.cursor];
  const player = allPlayers.find(p => p.id === playerId);
  const tally = TIER_INFO.map(t => Object.values(pos.tiers).filter(v => v === t.value).length);
  const { strengths, weaknesses } = topStrengthsWeaknesses(allPlayers, player);
  const age = computeDecimalAge(player.biography);
  const video = (player.videos || [])[0];

  app.innerHTML = `
    <div class="rank-grid">
      <div class="rank-util">
        <a class="link-menu" onclick="renderMenu()">Main Menu</a>
        <a class="link-save" id="saveProgressLink">Download Progress</a>
        <div class="tally">
          ${tally[0]} GLg All Star+<br>
          ${tally[2]} G League Rotation<br>
          ${tally[1]} G League Starter<br>
          ${tally[3]} Sub G League
        </div>
        <a class="link-skip" id="skipTop">Skip Player</a>
        <div class="menu-status" id="rankStatus"></div>
      </div>

      <div class="rank-video">
        ${video ? `<iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>` : `<div class="novideo">No video on file for this player yet.</div>`}
      </div>

      <div class="rank-right">
        <div class="sw-row">
          <div class="sw-box strengths">
            <div class="sw-title">Stat Strengths</div>
            ${strengths.length ? strengths.map(s => `<div class="sw-item">${dotsHtml(s.tier)}${s.label}</div>`).join('') : `<div class="sw-empty">No standout strengths yet.</div>`}
          </div>
          <div class="sw-box weaknesses">
            <div class="sw-title">Stat Weaknesses</div>
            ${weaknesses.length ? weaknesses.map(s => `<div class="sw-item">${dotsHtml(s.tier)}${s.label}</div>`).join('') : `<div class="sw-empty">No notable weaknesses yet.</div>`}
          </div>
        </div>
        <div class="tier-grid">
          ${TIER_INFO.map(t => `<button class="tier-btn ${t.cls}" data-tier="${t.value}">${t.label}</button>`).join('')}
        </div>
      </div>

      <div class="rank-stats">
        <h2>NCAA CAREER STATS</h2>
        <div class="rank-physicals">${age ?? 'xx.x'} years old, ${player.heightDisplay || 'height n/a'}, ${player.biography?.weight || 'weight n/a'}</div>
        <div class="rank-stat-grid">
          ${Object.entries(STAT_LABELS).map(([k, label]) => player.stats[k] != null ? `<div><span class="k">${label}:</span> <span class="v">${player.stats[k]}</span></div>` : '').join('')}
        </div>
      </div>

      <div class="rank-nav">
        <button id="prevBtn" ${pos.cursor === 0 ? 'disabled style="opacity:0.3;"' : ''}>&#9664; Previous Player</button>
        <span class="rank-nav-progress">${POS_KEY_TO_LABEL[currentPos]} ${pos.cursor + 1}/${pos.order.length}</span>
        <button class="rank-nav-skip" id="skipBottom">Skip Player</button>
        <button id="nextArrow">Next &#9654;</button>
      </div>
    </div>`;

  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pos.tiers[playerId] = Number(btn.dataset.tier);
      pos.cursor++;
      renderRankingScreen();
    });
  });
  document.getElementById('skipTop').addEventListener('click', () => { pos.cursor++; renderRankingScreen(); });
  document.getElementById('skipBottom').addEventListener('click', () => { pos.cursor++; renderRankingScreen(); });
  document.getElementById('nextArrow').addEventListener('click', () => { pos.cursor++; renderRankingScreen(); });
  document.getElementById('prevBtn').addEventListener('click', () => { if (pos.cursor > 0) { pos.cursor--; renderRankingScreen(); } });
  document.getElementById('saveProgressLink').addEventListener('click', () => saveProgress(document.getElementById('rankStatus')));
}

// ---- Boot ----
Promise.all([
  fetch(PLAYERS_PATH + '?v=' + Date.now()).then(r => r.json()),
  fetch(USERS_PATH + '?v=' + Date.now()).then(r => r.json()),
]).then(([players, users]) => {
  allPlayers = players;
  renderLogin(users);
}).catch(err => {
  document.getElementById('app').innerHTML = `<div class="login-wrap">Could not load data. ${err.message}</div>`;
});
</script>
</body>
</html>
